# ============================================================
# i3-tenant / external-secret.yaml
# Delivers the per-tenant LiteLLM virtual key from Vault KV v2
# via External Secrets Operator.
#
# HC-6: Secret path is  i3/tenants/<slug>/litellm-key
#        NO master-key reference is written anywhere in this chart.
# Test (a): grep for "master" or "LITELLM_MASTER_KEY" must return 0 matches.
# Test (d): ExternalSecret must reference the Vault path correctly.
# ============================================================
{{- $es := .Values.litellm.externalSecret }}
{{- $budget := index .Values.litellm.budgets .Values.tier }}
---
# ExternalSecret — fetches the LiteLLM virtual key from Vault
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-litellm-key" (include "i3-tenant.namespace" .) }}
  namespace: {{ include "i3-tenant.namespace" . }}
  labels:
    {{ include "i3-tenant.labels" . | nindent 4 }}
    i3.io/secret-type: litellm-virtual-key
spec:
  refreshInterval: {{ $es.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $es.secretStoreName | quote }}
    kind: {{ $es.secretStoreKind | quote }}
  target:
    name: {{ printf "%s-litellm-key" (include "i3-tenant.namespace" .) }}
    creationPolicy: Owner
    template:
      type: Opaque
      # Annotate the resulting Secret so workloads can discover it.
      metadata:
        labels:
          {{ include "i3-tenant.labels" . | nindent 10 }}
          i3.io/secret-type: litellm-virtual-key
        annotations:
          i3.io/tenant-id: {{ .Values.tenant.id | quote }}
          i3.io/litellm-budget: {{ $budget.max_budget | quote }}
          i3.io/litellm-tpm-limit: {{ $budget.tpm_limit | quote }}
          i3.io/litellm-rpm-limit: {{ $budget.rpm_limit | quote }}
  data:
    - secretKey: LITELLM_VIRTUAL_KEY
      remoteRef:
        # Vault KV v2 path: i3/tenants/<slug>/litellm-key
        # The platform operator writes the virtual key here via:
        #   bao kv put i3/tenants/<slug>/litellm-key value=<key>
        key: {{ printf "%s/%s/litellm-key" $es.vaultPathPrefix .Values.tenant.slug | quote }}
        property: value
---
# ConfigMap — carries budget metadata so the LiteLLM proxy can enforce
# per-tenant limits without reading the Secret directly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-litellm-budget" (include "i3-tenant.namespace" .) }}
  namespace: {{ include "i3-tenant.namespace" . }}
  labels:
    {{ include "i3-tenant.labels" . | nindent 4 }}
data:
  tenant_id: {{ .Values.tenant.id | quote }}
  tier: {{ .Values.tier | quote }}
  max_budget: {{ $budget.max_budget | quote }}
  budget_duration: {{ $budget.budget_duration | quote }}
  tpm_limit: {{ $budget.tpm_limit | quote }}
  rpm_limit: {{ $budget.rpm_limit | quote }}
