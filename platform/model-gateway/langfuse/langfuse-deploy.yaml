# ============================================================
# Langfuse — LLM Observability (Web + Worker + PostgreSQL)
# Namespace: i3-model-gateway
# Shared Ollama DB: langfuse_db on i3-postgres Crunchy cluster
# ============================================================

# ── Langfuse Secrets (placeholder) ──────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: langfuse-secrets
  namespace: i3-model-gateway
  annotations:
    openbao.org/agent-inject: "true"
    openbao.org/role: "model-gateway"
type: Opaque
stringData:
  NEXTAUTH_SECRET: "REPLACE_FROM_VAULT"
  SALT: "REPLACE_FROM_VAULT"
  LANGFUSE_INIT_ORG_ID: "i3-platform"
  LANGFUSE_INIT_ORG_NAME: "i3 Technologies"
  LANGFUSE_INIT_PROJECT_ID: "i3-main"
  LANGFUSE_INIT_PROJECT_NAME: "i3 Platform"
  LANGFUSE_INIT_USER_EMAIL: "admin@i3technologies.co.ke"
  LANGFUSE_INIT_USER_PASSWORD: "REPLACE_FROM_VAULT"
  DATABASE_URL: "postgresql://langfuse:REPLACE@i3-postgres-pgbouncer.i3-data.svc.cluster.local:5432/langfuse_db"

---
# ── Langfuse Web ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-web
  namespace: i3-model-gateway
  labels:
    app: langfuse-web
    app.kubernetes.io/part-of: i3-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-web
  template:
    metadata:
      labels:
        app: langfuse-web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/public/metrics/prometheus"
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: langfuse-web
          image: langfuse/langfuse:3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NEXTAUTH_URL
              value: "https://langfuse.i3technologies.co.ke"
            - name: PORT
              value: "3000"
            - name: LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES
              value: "false"
            - name: LANGFUSE_METRICS_API_ENABLED
              value: "true"
          envFrom:
            - secretRef:
                name: langfuse-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: langfuse-web
  namespace: i3-model-gateway
  labels:
    app: langfuse-web
spec:
  selector:
    app: langfuse-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  type: ClusterIP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: langfuse-web
  namespace: i3-model-gateway
  labels:
    app.kubernetes.io/part-of: i3-platform
spec:
  host: langfuse.i3technologies.co.ke
  to:
    kind: Service
    name: langfuse-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

---
# ── Langfuse Worker ──────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: langfuse-worker
  namespace: i3-model-gateway
  labels:
    app: langfuse-worker
    app.kubernetes.io/part-of: i3-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: langfuse-worker
  template:
    metadata:
      labels:
        app: langfuse-worker
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: langfuse-worker
          image: langfuse/langfuse-worker:3
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "3030"
          envFrom:
            - secretRef:
                name: langfuse-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3030
            initialDelaySeconds: 30
            periodSeconds: 30
