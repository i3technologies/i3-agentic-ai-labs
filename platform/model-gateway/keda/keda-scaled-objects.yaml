---
# ============================================================
# KEDA ScaledObjects — Model Gateway Autoscaling
# Scales LiteLLM based on HTTP request queue depth.
#
# KEDA-01: Ollama ScaledObject REMOVED.
#   Rationale: Ollama is a StatefulSet with RWO PVC (ollama-data).
#   Multiple replicas each load a full independent copy of all model
#   weights (~28 GB worst-case), exhausting the 50 Gi PVC and 16 Gi
#   RAM limit. Horizontal scaling of Ollama is not viable on this
#   bx2.4x16 CPU-only cluster. Vertical scaling (larger worker node)
#   or model sharding would be required.
#   Ollama remains at replicas:1 (fixed in vllm-deploy.yaml StatefulSet).
# ============================================================

# ── LiteLLM Proxy: scale 1→8 on queue depth via Prometheus ──────────────────
# KEDA-01: maxReplicaCount aligned to 8 (matching litellm-deploy.yaml KEDA block).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: litellm-proxy-scaler
  namespace: i3-model-gateway
spec:
  scaleTargetRef:
    name: litellm-proxy
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 1
  maxReplicaCount: 8
  triggers:
    - type: prometheus
      metadata:
        serverAddress: "http://prometheus-operated.i3-monitoring.svc.cluster.local:9090"
        metricName: litellm_requests_pending
        threshold: "20"
        query: >
          sum(rate(litellm_proxy_total_requests[1m]))
---
# ── EvalOS Sandbox: scale 1→10 on CPU (Prometheus trigger added when metrics live) ─
# Using cpu trigger as primary since EvalOS Prometheus metrics not yet scraped.
# minReplicaCount=1 (PVCs are RWO — cannot attach to 2 pods simultaneously).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: evalos-sandbox-scaler
  namespace: i3-evalos
spec:
  scaleTargetRef:
    name: evalos-sandbox
  pollingInterval: 30
  cooldownPeriod: 120
  minReplicaCount: 1
  maxReplicaCount: 4
  fallback:
    failureThreshold: 3
    replicas: 1
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "75"
---
# ── Admissions Agent: scale 1→4 on HTTP concurrency ─────────────────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: admissions-agent-scaler
  namespace: i3-admissions
spec:
  scaleTargetRef:
    name: admissions-agent
  pollingInterval: 20
  cooldownPeriod: 120
  minReplicaCount: 1
  maxReplicaCount: 4
  triggers:
    - type: prometheus
      metadata:
        serverAddress: "http://prometheus-operated.i3-monitoring.svc.cluster.local:9090"
        metricName: admissions_http_requests_active
        threshold: "10"
        query: >
          sum(rate(http_requests_total{namespace="i3-admissions"}[1m]))
---
# ── Engage Email Events Consumer: scale 1→4 on Kafka lag (FIX-12) ────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: engage-email-consumer-scaler
  namespace: i3-engage
spec:
  scaleTargetRef:
    name: email-consumer
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 1
  maxReplicaCount: 4
  triggers:
    - type: kafka
      metadata:
        topic: engage.email-events
        bootstrapServers: kafka-bootstrap.i3-messaging.svc.cluster.local:9092
        consumerGroup: engage-email-events
        lagThreshold: "10"
        offsetResetPolicy: latest

