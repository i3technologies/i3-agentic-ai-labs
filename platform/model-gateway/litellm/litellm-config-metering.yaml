apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: i3-model-gateway
  labels:
    app: litellm-proxy
    app.kubernetes.io/part-of: i3-platform
    i3.io/imp: IMP-07
  annotations:
    i3.io/description: >
      Metering spine config (IMP-07 / PLN-02/PLN-05).
      Adds budget enforcement, billing DB, and Prometheus spend callback.
      Replaces litellm-deploy.yaml general_settings block.
      Apply with: oc apply -f litellm-config-metering.yaml -n i3-model-gateway
data:
  config.yaml: |
    model_list:

      # ── Tier 3: Fast / Edge ────────────────────────────────────
      - model_name: granite-nano
        litellm_params:
          model: ollama/granite3.1-dense:2b
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 60
          max_tokens: 2048
        model_info:
          tier: 3

      - model_name: embed
        litellm_params:
          model: ollama/nomic-embed-text:v1.5
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 15
        model_info:
          tier: 3

      # ── Tier 2: RAG / Interactive Chat ────────────────────────
      - model_name: qwen-fast
        litellm_params:
          model: ollama/qwen2.5:7b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 180
          max_tokens: 4096
        model_info:
          tier: 2

      - model_name: coder
        litellm_params:
          model: ollama/qwen2.5-coder:7b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 180
          max_tokens: 4096
        model_info:
          tier: 2

      # ── Tier 1: Heavy Reasoning ──────────────────────────────
      - model_name: qwen-heavy
        litellm_params:
          model: ollama/qwen2.5:14b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 240
          max_tokens: 8192
        model_info:
          tier: 1

      - model_name: vision
        litellm_params:
          model: ollama/llava:13b-v1.6-mistral-q4
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 240
          max_tokens: 2048
        model_info:
          tier: 1

      # ── Backward-compatibility aliases ─────────────────────────
      - model_name: mistral-nemo
        litellm_params:
          model: ollama/qwen2.5:7b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 180
          max_tokens: 4096
        model_info:
          tier: 2

      - model_name: granite-heavy
        litellm_params:
          model: ollama/qwen2.5:14b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 240
          max_tokens: 8192
        model_info:
          tier: 1

    # ── Router ────────────────────────────────────────────────
    router_settings:
      routing_strategy: least-busy
      num_retries: 2
      retry_after: 5
      fallbacks:
        - qwen-heavy:  [qwen-fast]
        - qwen-fast:   [granite-nano]
        - coder:       [qwen-fast]
        - vision:      [qwen-heavy]
        - mistral-nemo:[granite-nano]
        - granite-heavy:[qwen-fast]
      allowed_fails: 3
      cooldown_time: 30

    # ── Redis Semantic Cache ─────────────────────────────────
    cache:
      type: redis
      host: redis.i3-data.svc.cluster.local
      port: 6379
      password: ${REDIS_PASSWORD}
      ttl: 3600
      similarity_threshold: 0.95

    # ── General settings (metering spine) ───────────────────
    general_settings:
      # R1: master_key is ONLY for the break-glass SA (injected via OpenBao agent).
      # Interactive use is disabled — see virtual-keys-metering-bootstrap.sh.
      master_key: "os.environ/LITELLM_MASTER_KEY"

      # Billing Postgres DB (litellm_billing_db via PGBouncer)
      # IMP-07: enables LiteLLM's built-in spend tracking per virtual key.
      database_url: "os.environ/LITELLM_BILLING_DB_URL"
      database_connection_pool_limit: 5
      database_connection_timeout: 30
      store_model_in_db: true

      # R4: budget enforcement is HARD and FAIL-CLOSED.
      # When a key hits max_budget, LiteLLM returns HTTP 429 immediately.
      # No graceful degradation, no fallback to un-metered path.
      budget_duration: "1mo"

      # Disable UI & dashboard — master_key interactive access is blocked.
      # Admin operations go through the key-rotation CronJob or break-glass SA.
      disable_master_key_hash: false          # keep hashing; disabling is weaker
      allow_user_auth: false                  # no UI login (R1)
      ui_access_mode: "proxy_only"

    # ── Observability ────────────────────────────────────────
    litellm_settings:
      success_callback: ["langfuse", "prometheus"]
      failure_callback: ["langfuse", "prometheus"]
      service_callback: ["prometheus"]
      langfuse_public_key: "os.environ/LANGFUSE_PUBLIC_KEY"
      langfuse_secret_key: "os.environ/LANGFUSE_SECRET_KEY"
      langfuse_host: "http://langfuse.i3-model-gateway.svc.cluster.local:3000"
      set_verbose: false
      json_logs: true
      request_timeout: 300
      drop_params: true

      # IMP-07: emit per-key spend metrics to Prometheus for alerting
      # Metric: litellm_spend_per_key{key_alias, customer_id, project_id}
      prometheus_port: 4001
