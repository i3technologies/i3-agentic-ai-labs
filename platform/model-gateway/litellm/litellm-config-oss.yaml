apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: i3-model-gateway
  labels:
    app.kubernetes.io/part-of: i3-platform
data:
  config.yaml: |
    model_list:

      # ── Fast / Edge ─────────────────────────────────────────
      - model_name: granite-nano
        litellm_params:
          model: ollama/granite3.1-dense:2b
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 30
          max_tokens: 2048

      - model_name: embed
        litellm_params:
          model: ollama/nomic-embed-text:latest
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 15

      # ── Interactive Chat ─────────────────────────────────────
      - model_name: qwen-fast
        litellm_params:
          model: ollama/qwen2.5:7b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 90
          max_tokens: 4096

      - model_name: coder
        litellm_params:
          model: ollama/qwen2.5-coder:7b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 90
          max_tokens: 4096

      # ── Heavy Reasoning ──────────────────────────────────────
      - model_name: qwen-heavy
        litellm_params:
          model: ollama/qwen2.5:14b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 180
          max_tokens: 8192

      - model_name: vision
        litellm_params:
          model: ollama/llava:13b
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 180
          max_tokens: 2048

    # ── Router: fallback chain ─────────────────────────────────
    router_settings:
      routing_strategy: least-busy
      num_retries: 2
      retry_after: 1
      fallbacks:
        - qwen-heavy:
            - qwen-fast
        - qwen-fast:
            - granite-nano
        - coder:
            - qwen-fast
        - vision:
            - qwen-heavy
      allowed_fails: 3
      cooldown_time: 30

    # ── General settings ────────────────────────────────────────
    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      # database_url intentionally omitted — config-file-only mode.
      # Prisma advisory-lock timeout was preventing model registration at startup.
      store_model_in_db: false

    # ── Observability ────────────────────────────────────────────
    litellm_settings:
      success_callback: ["langfuse"]
      failure_callback: ["langfuse"]
      service_callback: ["prometheus"]
      langfuse_public_key: "os.environ/LANGFUSE_PUBLIC_KEY"
      langfuse_secret_key: "os.environ/LANGFUSE_SECRET_KEY"
      langfuse_host: "http://langfuse.i3-ott.svc.cluster.local:3000"
      set_verbose: false
      json_logs: true
      request_timeout: 180
      drop_params: true
