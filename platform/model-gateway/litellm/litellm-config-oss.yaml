apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: i3-model-gateway
  labels:
    app.kubernetes.io/part-of: i3-platform
data:
  config.yaml: |
    model_list:

      # ── Tier 3: Fast / Edge (sub-second to 5s, always warm) ──
      - model_name: granite-nano
        litellm_params:
          model: ollama/granite3.1-dense:2b
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 30
          max_tokens: 2048
        model_info:
          tier: 3
          description: "IBM Granite 3.1 2B — fast intent routing and classification"

      - model_name: embed
        litellm_params:
          model: ollama/nomic-embed-text:latest
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 15
        model_info:
          tier: 3
          description: "Nomic Embed Text v1.5 — 768-dim embeddings for all RAG pipelines"

      # ── Tier 2: RAG / Interactive Chat (10–45s on CPU) ────────
      - model_name: qwen-fast
        litellm_params:
          model: ollama/qwen2.5:7b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 90
          max_tokens: 4096
        model_info:
          tier: 2
          description: "Qwen2.5 7B — Study Coach, RAG chat, Onboarding, i3-Engage"

      - model_name: coder
        litellm_params:
          model: ollama/qwen2.5-coder:7b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 90
          max_tokens: 4096
        model_info:
          tier: 2
          description: "Qwen2.5-Coder 7B — AI Lab coding labs, code review, EvalOS code assessment"

      # ── Tier 1: Heavy Reasoning (30–120s on CPU, async tasks) ─
      - model_name: qwen-heavy
        litellm_params:
          model: ollama/qwen2.5:14b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 180
          max_tokens: 8192
        model_info:
          tier: 1
          description: "Qwen2.5 14B — AI interview evaluation, PMaaS reports, AfroERP finance agent"

      - model_name: vision
        litellm_params:
          model: ollama/llava:13b
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 180
          max_tokens: 2048
        model_info:
          tier: 1
          description: "LLaVA 13B — multimodal image+text, document OCR, certificate validation"

    # ── Router: fallback chain ─────────────────────────────────
    router_settings:
      routing_strategy: least-busy
      num_retries: 2
      retry_after: 1
      fallbacks:
        - qwen-heavy:
            - qwen-fast
        - qwen-fast:
            - granite-nano
        - coder:
            - qwen-fast
        - vision:
            - qwen-heavy
      allowed_fails: 3
      cooldown_time: 30

    # ── General settings ────────────────────────────────────────
    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      database_url: "os.environ/DATABASE_URL"
      store_model_in_db: true

    # ── Observability ────────────────────────────────────────────
    litellm_settings:
      success_callback: ["langfuse"]
      failure_callback: ["langfuse"]
      service_callback: ["prometheus"]
      langfuse_public_key: "os.environ/LANGFUSE_PUBLIC_KEY"
      langfuse_secret_key: "os.environ/LANGFUSE_SECRET_KEY"
      langfuse_host: "http://langfuse.i3-ott.svc.cluster.local:3000"
      set_verbose: false
      json_logs: true
      request_timeout: 180
      drop_params: true
