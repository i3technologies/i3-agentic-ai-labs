# ============================================================
# LiteLLM Proxy — Tiered Model Gateway
# Namespace: i3-model-gateway
# Tier 3 (Edge):    DistilBERT intent + Granite 4.0 Nano 2B
# Tier 2 (RAG):     Mistral NeMo 12B + DeepSeek-Coder-V2 Lite 16B
# Tier 1 (Heavy):   watsonx.ai external endpoints
# ============================================================

# ── ConfigMap: LiteLLM routing config ───────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: i3-model-gateway
  labels:
    app.kubernetes.io/part-of: i3-platform
data:
  config.yaml: |
    model_list:
      # ── Tier 3: Edge / Intent Classification ──────────────
      - model_name: granite-nano
        litellm_params:
          model: ollama/granite3.1-dense:2b
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 15
          max_tokens: 2048
        model_info:
          tier: 3
          description: "IBM Granite 3.1 2B - fast edge inference"

      - model_name: distilbert-intent
        litellm_params:
          model: huggingface/distilbert-base-uncased
          api_base: http://distilbert-service.i3-model-gateway.svc.cluster.local:8080
          timeout: 5
          max_tokens: 512
        model_info:
          tier: 3
          description: "DistilBERT 66M - sub-ms intent routing"

      # ── Tier 2: RAG / Reasoning ───────────────────────────
      - model_name: mistral-nemo
        litellm_params:
          model: ollama/mistral-nemo:12b
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 60
          max_tokens: 8192
        model_info:
          tier: 2
          description: "Mistral NeMo 12B - RAG and reasoning"

      - model_name: deepseek-coder
        litellm_params:
          model: ollama/deepseek-coder-v2:16b
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 90
          max_tokens: 8192
        model_info:
          tier: 2
          description: "DeepSeek-Coder-V2 Lite 16B - code generation"

      # ── Tier 1: Heavy / Production (watsonx.ai external) ──
      - model_name: granite-heavy
        litellm_params:
          model: watsonx/ibm/granite-3-8b-instruct
          api_key: "os.environ/WATSONX_API_KEY"
          watsonx_url: "https://eu-de.ml.cloud.ibm.com"
          project_id: "os.environ/WATSONX_PROJECT_ID"
          timeout: 120
          max_tokens: 16384
        model_info:
          tier: 1
          description: "IBM Granite 3 8B via watsonx.ai"

      - model_name: granite-vision
        litellm_params:
          model: watsonx/ibm/granite-vision-3-2-2b
          api_key: "os.environ/WATSONX_API_KEY"
          watsonx_url: "https://eu-de.ml.cloud.ibm.com"
          project_id: "os.environ/WATSONX_PROJECT_ID"
          timeout: 120
        model_info:
          tier: 1
          description: "IBM Granite Vision 3.2 2B"

    # ── Router settings ─────────────────────────────────────
    router_settings:
      routing_strategy: least-busy
      num_retries: 2
      retry_after: 1
      fallbacks:
        - granite-nano:
            - mistral-nemo
        - distilbert-intent:
            - granite-nano
      allowed_fails: 3
      cooldown_time: 30

    # ── General settings ────────────────────────────────────
    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      database_url: "os.environ/DATABASE_URL"
      store_model_in_db: true

    litellm_settings:
      success_callback: ["langfuse"]
      failure_callback: ["langfuse"]
      service_callback: ["prometheus"]
      langfuse_public_key: "os.environ/LANGFUSE_PUBLIC_KEY"
      langfuse_secret_key: "os.environ/LANGFUSE_SECRET_KEY"
      langfuse_host: "http://langfuse-web.i3-model-gateway.svc.cluster.local:3000"
      set_verbose: false
      json_logs: true
      request_timeout: 120
      drop_params: true

---
# ── Secret: LiteLLM credentials (placeholder — real values from OpenBao) ──
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: i3-model-gateway
  labels:
    app.kubernetes.io/part-of: i3-platform
  annotations:
    # Real values injected via OpenBao agent sidecar or External Secrets Operator
    openbao.org/agent-inject: "true"
    openbao.org/role: "model-gateway"
type: Opaque
stringData:
  LITELLM_MASTER_KEY: "REPLACE_WITH_SECURE_KEY_FROM_VAULT"
  WATSONX_API_KEY: "REPLACE_WITH_WATSONX_KEY"
  WATSONX_PROJECT_ID: "REPLACE_WITH_PROJECT_ID"
  LANGFUSE_PUBLIC_KEY: "REPLACE_FROM_LANGFUSE"
  LANGFUSE_SECRET_KEY: "REPLACE_FROM_LANGFUSE"
  DATABASE_URL: "postgresql://langfuse:REPLACE@i3-postgres-pgbouncer.i3-data.svc:5432/langfuse_db"

---
# ── Deployment: LiteLLM Proxy ───────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: i3-model-gateway
  labels:
    app: litellm-proxy
    app.kubernetes.io/part-of: i3-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
            - "--num_workers"
            - "4"
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: litellm-config

---
# ── Service ──────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: i3-model-gateway
  labels:
    app: litellm-proxy
    app.kubernetes.io/part-of: i3-platform
spec:
  selector:
    app: litellm-proxy
  ports:
    - name: http
      port: 4000
      targetPort: 4000

---
# ── Route: external access via OCP ingress ───────────────────
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: litellm-proxy
  namespace: i3-model-gateway
  labels:
    app.kubernetes.io/part-of: i3-platform
spec:
  to:
    kind: Service
    name: litellm-proxy
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

---
# ── KEDA ScaledObject: scale-to-zero when idle ───────────────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: litellm-proxy-scaler
  namespace: i3-model-gateway
  labels:
    app.kubernetes.io/part-of: i3-platform
spec:
  scaleTargetRef:
    name: litellm-proxy
  minReplicaCount: 1
  maxReplicaCount: 8
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.i3-monitoring.svc.cluster.local:9090
        metricName: litellm_request_total
        threshold: "50"
        query: sum(rate(litellm_request_total[1m]))
