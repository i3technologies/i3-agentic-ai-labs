# ============================================================
# LiteLLM Proxy — OSS Tiered Model Gateway
# Namespace:    i3-model-gateway
# Tier 3 (Edge):   Granite 3.1 2B + Nomic Embed v1.5
# Tier 2 (Chat):   Qwen2.5 7B + Qwen2.5-Coder 7B
# Tier 1 (Heavy):  Qwen2.5 14B + LLaVA 13B
# Updated:      10 September 2026 — removed watsonx SaaS deps,
#               replaced with 100% on-cluster Ollama models.
# ============================================================

# ── ConfigMap: LiteLLM routing config (also in litellm-config-oss.yaml)
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: i3-model-gateway
  labels:
    app: litellm-proxy
    app.kubernetes.io/part-of: i3-platform
data:
  config.yaml: |
    model_list:

      # ── Tier 3: Fast / Edge (sub-second to 5s, always warm) ──
      - model_name: granite-nano
        litellm_params:
          model: ollama/granite3.1-dense:2b
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 30
          max_tokens: 2048
        model_info:
          tier: 3
          description: "IBM Granite 3.1 2B — fast intent routing, classification, onboarding"

      - model_name: embed
        litellm_params:
          model: ollama/nomic-embed-text:v1.5
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 15
        model_info:
          tier: 3
          description: "Nomic Embed Text v1.5 — 768-dim embeddings for all RAG pipelines"

      # ── Tier 2: RAG / Interactive Chat (10–45s on CPU) ───────
      - model_name: qwen-fast
        litellm_params:
          model: ollama/qwen2.5:7b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 90
          max_tokens: 4096
        model_info:
          tier: 2
          description: "Qwen2.5 7B — Study Coach (upgrade), RAG chat, Onboarding, i3-Engage, Zuri"

      - model_name: coder
        litellm_params:
          model: ollama/qwen2.5-coder:7b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 90
          max_tokens: 4096
        model_info:
          tier: 2
          description: "Qwen2.5-Coder 7B — AI Interview code Qs, Coding Lab, code review, n8n gen"

      # ── Tier 1: Heavy Reasoning (30–120s on CPU, async tasks) ─
      - model_name: qwen-heavy
        litellm_params:
          model: ollama/qwen2.5:14b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 180
          max_tokens: 8192
        model_info:
          tier: 1
          description: "Qwen2.5 14B — AI interview eval, PMaaS war room, AfroERP finance agent, admin reports"

      - model_name: vision
        litellm_params:
          model: ollama/llava:13b-v1.6-mistral-q4
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 180
          max_tokens: 2048
        model_info:
          tier: 1
          description: "LLaVA 13B — image+text, doc OCR, invoice parsing, certificate validation"

    # ── Router: fallback chain ──────────────────────────────────
    router_settings:
      routing_strategy: least-busy
      num_retries: 2
      retry_after: 1
      fallbacks:
        - qwen-heavy:
            - qwen-fast
        - qwen-fast:
            - granite-nano
        - coder:
            - qwen-fast
        - vision:
            - qwen-heavy
      allowed_fails: 3
      cooldown_time: 30

    # ── General settings ────────────────────────────────────────
    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      database_url: "os.environ/DATABASE_URL"
      store_model_in_db: true

    # ── Observability ────────────────────────────────────────────
    litellm_settings:
      success_callback: ["langfuse"]
      failure_callback: ["langfuse"]
      service_callback: ["prometheus"]
      langfuse_public_key: "os.environ/LANGFUSE_PUBLIC_KEY"
      langfuse_secret_key: "os.environ/LANGFUSE_SECRET_KEY"
      langfuse_host: "http://langfuse.i3-ott.svc.cluster.local:3000"
      set_verbose: false
      json_logs: true
      request_timeout: 180
      drop_params: true

---
# ── Secret: LiteLLM credentials (real values from OpenBao/oc patch)
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: i3-model-gateway
  labels:
    app: litellm-proxy
    app.kubernetes.io/part-of: i3-platform
  annotations:
    openbao.org/agent-inject: "true"
    openbao.org/role: "model-gateway"
type: Opaque
stringData:
  # Generate: openssl rand -hex 24 | tr -a-z A-Z | sed 's/^/sk-litellm-i3-/'
  LITELLM_MASTER_KEY: "REPLACE_WITH_SECURE_KEY"
  # Langfuse keys from i3-ott Langfuse (EvalOS project)
  LANGFUSE_PUBLIC_KEY: "pk-lf-i3evalos-8ed2998c3f68449b"
  LANGFUSE_SECRET_KEY: "REPLACE_WITH_LANGFUSE_SECRET"
  # pgbouncer URL (NOT direct primary — avoids connection saturation)
  DATABASE_URL: "postgresql://langfuse:LangfuseDB2026i3@i3-postgres-pgbouncer.i3-data.svc:5432/langfuse_db?pgbouncer=true&connection_limit=5"

---
# ── Deployment: LiteLLM Proxy ────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-proxy
  namespace: i3-model-gateway
  labels:
    app: litellm-proxy
    app.kubernetes.io/part-of: i3-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: litellm-proxy
  template:
    metadata:
      labels:
        app: litellm-proxy
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/app/config.yaml"
            - "--port"
            - "4000"
            - "--num_workers"
            - "4"
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: litellm-config

---
# ── Service ──────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: litellm-proxy
  namespace: i3-model-gateway
  labels:
    app: litellm-proxy
    app.kubernetes.io/part-of: i3-platform
spec:
  selector:
    app: litellm-proxy
  ports:
    - name: http
      port: 4000
      targetPort: 4000

---
# ── Route: external HTTPS via OCP ingress ────────────────────
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: litellm-proxy
  namespace: i3-model-gateway
  labels:
    app.kubernetes.io/part-of: i3-platform
spec:
  host: litellm.i3technologies.co.ke
  to:
    kind: Service
    name: litellm-proxy
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

---
# ── KEDA ScaledObject: scale 1→8 replicas on request load ────
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: litellm-proxy-scaler
  namespace: i3-model-gateway
  labels:
    app.kubernetes.io/part-of: i3-platform
spec:
  scaleTargetRef:
    name: litellm-proxy
  minReplicaCount: 1
  maxReplicaCount: 8
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.i3-monitoring.svc.cluster.local:9090
        metricName: litellm_request_total
        threshold: "50"
        query: sum(rate(litellm_request_total[1m]))
