# ============================================================
# IMP-10 — LiteLLM GPU Routing Config  [GAP]
# ============================================================
# ⚠ [GAP] GPU ACCELERATION NOT YET BENCHMARKED
#   This ConfigMap MUST NOT replace litellm-config (the canonical
#   CPU config) until bench_gpu.py prints PASS for every model
#   alias below.  Deploy as "litellm-config-gpu" and switch the
#   Deployment volume reference only after PASS.
#
# Strategy
# ─────────
# Each production alias gains a paired GPU entry:
#   <alias>-gpu   → ollama-gpu-service:11435  (primary, tight timeout)
#   <alias>       → ollama-service:11434      (CPU fallback, unchanged)
#
# The router_settings.fallbacks block wires GPU → CPU for every alias.
# On GPU node failure or timeout, LiteLLM automatically promotes the
# CPU backend.  allowed_fails:3 + cooldown_time:60 prevents flapping.
#
# Timeout budget (GPU path):
#   Tier 3 edge:   15s  (CPU was  60s)
#   Tier 2 chat:   45s  (CPU was 180s)
#   Tier 1 heavy: 120s  (CPU was 240s)
# Benchmarks MUST beat these numbers for PASS.
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config-gpu
  namespace: i3-model-gateway
  labels:
    app: litellm-proxy
    app.kubernetes.io/part-of: i3-platform
    i3.platform/imp: "IMP-10"
  annotations:
    i3.platform/gap: >
      GPU serving config — NOT active. Switch Deployment volume from
      litellm-config to litellm-config-gpu only after bench_gpu.py PASS.
data:
  config.yaml: |
    model_list:

      # ════════════════════════════════════════════════════════
      # GPU PRIMARIES  [GAP — gated on benchmark PASS]
      # ════════════════════════════════════════════════════════

      # ── Tier 3 GPU ──────────────────────────────────────────
      - model_name: granite-nano-gpu
        litellm_params:
          model: ollama/granite3.1-dense:2b
          api_base: http://ollama-gpu.i3-model-gateway.svc.cluster.local:11435
          timeout: 15
          max_tokens: 2048
        model_info:
          tier: 3
          description: "[GAP] IBM Granite 3.1 2B — GPU primary (benchmark-gated)"

      - model_name: embed-gpu
        litellm_params:
          model: ollama/nomic-embed-text:v1.5
          api_base: http://ollama-gpu.i3-model-gateway.svc.cluster.local:11435
          timeout: 8
        model_info:
          tier: 3
          description: "[GAP] Nomic Embed v1.5 — GPU primary (benchmark-gated)"

      # ── Tier 2 GPU ──────────────────────────────────────────
      - model_name: qwen-fast-gpu
        litellm_params:
          model: ollama/qwen2.5:7b-instruct-q4_K_M
          api_base: http://ollama-gpu.i3-model-gateway.svc.cluster.local:11435
          timeout: 45
          max_tokens: 4096
        model_info:
          tier: 2
          description: "[GAP] Qwen2.5 7B — GPU primary (benchmark-gated)"

      - model_name: coder-gpu
        litellm_params:
          model: ollama/qwen2.5-coder:7b-instruct-q4_K_M
          api_base: http://ollama-gpu.i3-model-gateway.svc.cluster.local:11435
          timeout: 45
          max_tokens: 4096
        model_info:
          tier: 2
          description: "[GAP] Qwen2.5-Coder 7B — GPU primary (benchmark-gated)"

      # ── Tier 1 GPU ──────────────────────────────────────────
      - model_name: qwen-heavy-gpu
        litellm_params:
          model: ollama/qwen2.5:14b-instruct-q4_K_M
          api_base: http://ollama-gpu.i3-model-gateway.svc.cluster.local:11435
          timeout: 120
          max_tokens: 8192
        model_info:
          tier: 1
          description: "[GAP] Qwen2.5 14B — GPU primary (benchmark-gated)"

      - model_name: vision-gpu
        litellm_params:
          model: ollama/llava:13b-v1.6-mistral-q4
          api_base: http://ollama-gpu.i3-model-gateway.svc.cluster.local:11435
          timeout: 120
          max_tokens: 2048
        model_info:
          tier: 1
          description: "[GAP] LLaVA 13B — GPU primary (benchmark-gated)"

      # ── Aliases GPU ─────────────────────────────────────────
      - model_name: mistral-nemo-gpu
        litellm_params:
          model: ollama/qwen2.5:7b-instruct-q4_K_M
          api_base: http://ollama-gpu.i3-model-gateway.svc.cluster.local:11435
          timeout: 45
          max_tokens: 4096
        model_info:
          tier: 2
          description: "[GAP] Alias → qwen-fast-gpu. Backward-compat for admissions-agent."

      - model_name: granite-heavy-gpu
        litellm_params:
          model: ollama/qwen2.5:14b-instruct-q4_K_M
          api_base: http://ollama-gpu.i3-model-gateway.svc.cluster.local:11435
          timeout: 120
          max_tokens: 8192
        model_info:
          tier: 1
          description: "[GAP] Alias → qwen-heavy-gpu. Backward-compat for onboarding-agent."

      # ════════════════════════════════════════════════════════
      # CPU FALLBACKS  (identical to litellm-config canonical)
      # ════════════════════════════════════════════════════════

      - model_name: granite-nano
        litellm_params:
          model: ollama/granite3.1-dense:2b
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 60
          max_tokens: 2048
        model_info:
          tier: 3
          description: "IBM Granite 3.1 2B — CPU fallback (always warm, terminal)"

      - model_name: embed
        litellm_params:
          model: ollama/nomic-embed-text:v1.5
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 15
        model_info:
          tier: 3
          description: "Nomic Embed v1.5 — CPU fallback"

      - model_name: qwen-fast
        litellm_params:
          model: ollama/qwen2.5:7b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 180
          max_tokens: 4096
        model_info:
          tier: 2
          description: "Qwen2.5 7B — CPU fallback"

      - model_name: coder
        litellm_params:
          model: ollama/qwen2.5-coder:7b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 180
          max_tokens: 4096
        model_info:
          tier: 2
          description: "Qwen2.5-Coder 7B — CPU fallback"

      - model_name: qwen-heavy
        litellm_params:
          model: ollama/qwen2.5:14b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 240
          max_tokens: 8192
        model_info:
          tier: 1
          description: "Qwen2.5 14B — CPU fallback"

      - model_name: vision
        litellm_params:
          model: ollama/llava:13b-v1.6-mistral-q4
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 240
          max_tokens: 2048
        model_info:
          tier: 1
          description: "LLaVA 13B — CPU fallback"

      - model_name: mistral-nemo
        litellm_params:
          model: ollama/qwen2.5:7b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 180
          max_tokens: 4096
        model_info:
          tier: 2
          description: "Alias → qwen-fast CPU. Backward-compat for admissions-agent."

      - model_name: granite-heavy
        litellm_params:
          model: ollama/qwen2.5:14b-instruct-q4_K_M
          api_base: http://ollama-service.i3-model-gateway.svc.cluster.local:11434
          timeout: 240
          max_tokens: 8192
        model_info:
          tier: 1
          description: "Alias → qwen-heavy CPU. Backward-compat for onboarding-agent."

    # ── Router: GPU primary → CPU fallback ──────────────────
    # [GAP] These fallback chains are INACTIVE until bench_gpu.py PASS.
    # After PASS, callers should address the *-gpu aliases; CPU aliases
    # remain available as standalone names for direct CPU-targeted calls.
    router_settings:
      routing_strategy: least-busy
      num_retries: 2
      retry_after: 5
      fallbacks:
        # ── GPU → CPU fallbacks ──────────────────────────────
        - granite-nano-gpu:
            - granite-nano
        - embed-gpu:
            - embed
        - qwen-fast-gpu:
            - qwen-fast
        - coder-gpu:
            - coder
        - qwen-heavy-gpu:
            - qwen-heavy
        - vision-gpu:
            - vision
        - mistral-nemo-gpu:
            - mistral-nemo
        - granite-heavy-gpu:
            - granite-heavy
        # ── CPU-only inter-tier fallbacks (unchanged from canonical) ──
        - qwen-heavy:
            - qwen-fast
        - qwen-fast:
            - granite-nano
        - coder:
            - qwen-fast
        - vision:
            - qwen-heavy
        - mistral-nemo:
            - granite-nano
        - granite-heavy:
            - qwen-fast
      # granite-nano has NO fallback — terminal CPU anchor.
      allowed_fails: 3
      # Longer cooldown than CPU-only config: GPU nodes take ~90s to
      # recover after a driver fault; avoid hammering a node that is
      # still restarting.
      cooldown_time: 60

    # ── Redis Semantic Cache (unchanged) ───────────────────────
    cache:
      type: redis
      host: redis.i3-data.svc.cluster.local
      port: 6379
      password: ${REDIS_PASSWORD}
      ttl: 3600
      similarity_threshold: 0.95

    # ── General settings (unchanged) ───────────────────────────
    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      database_url: "os.environ/DATABASE_URL"
      database_connection_pool_limit: 5
      database_connection_timeout: 30
      store_model_in_db: true

    # ── Observability (unchanged) ───────────────────────────────
    litellm_settings:
      success_callback: ["langfuse"]
      failure_callback: ["langfuse"]
      service_callback: ["prometheus"]
      langfuse_public_key: "os.environ/LANGFUSE_PUBLIC_KEY"
      langfuse_secret_key: "os.environ/LANGFUSE_SECRET_KEY"
      langfuse_host: "http://langfuse.i3-model-gateway.svc.cluster.local:3000"
      set_verbose: false
      json_logs: true
      # Must be >= largest GPU timeout (120s) with margin.
      # Lower than CPU config (300s) because GPU paths are faster.
      request_timeout: 180
      drop_params: true
