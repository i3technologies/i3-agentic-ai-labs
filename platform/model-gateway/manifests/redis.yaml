---
# Redis deployment for i3-model-gateway namespace
# Used by LiteLLM proxy for semantic caching (SC-P3-01-A)
# Mirrors the pattern used in i3-ott/redis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: i3-model-gateway
  labels:
    app: redis
    app.kubernetes.io/part-of: i3-platform
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: i3-model-gateway
  labels:
    app: redis
    app.kubernetes.io/part-of: i3-platform
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
