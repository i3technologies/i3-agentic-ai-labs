# ============================================================
# Strimzi Kafka — KRaft Mode (ZooKeeper-free)
# Namespace: i3-messaging
# Operator: strimzi-kafka-operator (community-operators)
# 3 combined broker+controller nodes (KRaft quorum)
# ============================================================

apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: i3-kafka-combined
  namespace: i3-messaging
  labels:
    strimzi.io/cluster: i3-kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 20Gi
        class: ibmc-vpc-block-retain-10iops-tier
        deleteClaim: false
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  template:
    pod:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    strimzi.io/cluster: i3-kafka
                topologyKey: kubernetes.io/hostname

---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: i3-kafka
  namespace: i3-messaging
  labels:
    app.kubernetes.io/part-of: i3-platform
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.7.0
    metadataVersion: 3.7-IV4
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: tls
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      log.retention.hours: 168      # 7 days
      log.retention.bytes: "10737418240"   # 10 GB per partition
      log.segment.bytes: "1073741824"
      auto.create.topics.enable: "false"
      num.partitions: 3
      # Prometheus JMX exporter
      kafka.metrics.reporters: ""
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics-config
          key: kafka-metrics-config.yml
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi
    userOperator:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 256Mi

---
# Platform Topics
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: admissions-leads
  namespace: i3-messaging
  labels:
    strimzi.io/cluster: i3-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "604800000"   # 7 days
    cleanup.policy: delete

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: evalos-submissions
  namespace: i3-messaging
  labels:
    strimzi.io/cluster: i3-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: "2592000000"  # 30 days
    cleanup.policy: delete

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: ott-stream-events
  namespace: i3-messaging
  labels:
    strimzi.io/cluster: i3-kafka
spec:
  partitions: 3
  replicas: 3
  config:
    retention.ms: "86400000"   # 1 day
    cleanup.policy: delete

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: ai-lab-usage
  namespace: i3-messaging
  labels:
    strimzi.io/cluster: i3-kafka
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: "2592000000"
    cleanup.policy: delete

---
# JMX metrics ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics-config
  namespace: i3-messaging
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    lowercaseOutputLabelNames: true
    rules:
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels:
          clientId: "$3"
          topic: "$4"
          partition: "$5"
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), brokerHost=(.+), brokerPort=(.+)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels:
          clientId: "$3"
          broker: "$4:$5"
      - pattern: kafka.server<type=(.+), name=(.+)><>OneMinuteRate
        name: kafka_server_$1_$2_rate
        type: GAUGE
