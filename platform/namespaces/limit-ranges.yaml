# ============================================================
# i3 Unified Platform — LimitRanges
# Applied by: kubectl apply -f platform/namespaces/limit-ranges.yaml
# Purpose:
#   - Prevent unbounded containers from starving the cluster
#   - Set safe defaults so pods without resource specs still get limits
#   - Applied to all 11 managed namespaces
# ============================================================

# ─── i3-data: PostgreSQL workloads (high memory tolerance) ───
apiVersion: v1
kind: LimitRange
metadata:
  name: i3-data-limits
  namespace: i3-data
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 1Gi
      defaultRequest:
        cpu: 250m
        memory: 256Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 50m
        memory: 64Mi
    - type: Pod
      max:
        cpu: "8"
        memory: 16Gi
    - type: PersistentVolumeClaim
      max:
        storage: 100Gi
      min:
        storage: 1Gi

---
# ─── i3-messaging: Kafka (CPU + memory intensive) ─────────────
apiVersion: v1
kind: LimitRange
metadata:
  name: i3-messaging-limits
  namespace: i3-messaging
spec:
  limits:
