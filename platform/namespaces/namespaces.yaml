# ============================================================
# i3 Unified Platform — 17-Namespace Topology
# Applied by: kubectl apply -f platform/namespaces/
# CRITICAL: solution-01..08 are listed as read-only references.
#           They must NEVER be applied/modified by this pipeline.
# ============================================================

