# ============================================================
# Directus CMS — Headless Content Management
# Namespace: i3-ott
# Database: directus_db on i3-postgres Crunchy cluster
# Auth: Keycloak OIDC via directus-cms client
# Purpose: VOD catalog, class schedule, course metadata
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: directus
  namespace: i3-ott
  labels:
    app: directus
    app.kubernetes.io/part-of: i3-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: directus
  template:
    metadata:
      labels:
        app: directus
    spec:
      securityContext:
        runAsUser: 1000
        runAsNonRoot: true
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z i3-postgres-pgbouncer.i3-data.svc.cluster.local 5432; do
                echo "Waiting for PostgreSQL..."; sleep 3
              done
      containers:
        - name: directus
          image: directus/directus:11.1.0
          ports:
            - name: http
              containerPort: 8055
          env:
            - name: PUBLIC_URL
              value: "https://cms.i3technologies.co.ke"
            - name: PORT
              value: "8055"
            - name: DB_CLIENT
              value: pg
            - name: DB_HOST
              value: i3-postgres-pgbouncer.i3-data.svc.cluster.local
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: directus_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: directus-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: directus-secrets
                  key: DB_PASSWORD
            - name: KEY
              valueFrom:
                secretKeyRef:
                  name: directus-secrets
                  key: KEY
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: directus-secrets
                  key: SECRET
            - name: ADMIN_EMAIL
              value: "admin@i3technologies.co.ke"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: directus-secrets
                  key: ADMIN_PASSWORD
            - name: AUTH_PROVIDERS
              value: "keycloak"
            - name: AUTH_KEYCLOAK_DRIVER
              value: openid
            - name: AUTH_KEYCLOAK_CLIENT_ID
              value: directus-cms
            - name: AUTH_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: directus-secrets
                  key: KEYCLOAK_CLIENT_SECRET
            - name: AUTH_KEYCLOAK_ISSUER_URL
              value: "https://sso.i3technologies.co.ke/realms/i3"
            - name: STORAGE_LOCATIONS
              value: seaweedfs
            - name: STORAGE_SEAWEEDFS_DRIVER
              value: s3
            - name: STORAGE_SEAWEEDFS_KEY
              valueFrom:
                secretKeyRef:
                  name: directus-secrets
                  key: SEAWEEDFS_ACCESS_KEY
            - name: STORAGE_SEAWEEDFS_SECRET
              valueFrom:
                secretKeyRef:
                  name: directus-secrets
                  key: SEAWEEDFS_SECRET_KEY
            - name: STORAGE_SEAWEEDFS_BUCKET
              value: i3-cms-assets
            - name: STORAGE_SEAWEEDFS_ENDPOINT
              value: "http://seaweedfs-s3.i3-ott.svc.cluster.local:8333"
            - name: STORAGE_SEAWEEDFS_REGION
              value: eu-de
            - name: STORAGE_SEAWEEDFS_FORCE_PATH_STYLE
              value: "true"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /server/health
              port: 8055
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /server/health
              port: 8055
            initialDelaySeconds: 20
            periodSeconds: 15

---
apiVersion: v1
kind: Secret
metadata:
  name: directus-secrets
  namespace: i3-ott
  annotations:
    openbao.org/agent-inject: "true"
    openbao.org/role: "ott"
type: Opaque
stringData:
  DB_USER: "REPLACE_FROM_VAULT"
  DB_PASSWORD: "REPLACE_FROM_VAULT"
  KEY: "REPLACE_FROM_VAULT"
  SECRET: "REPLACE_FROM_VAULT"
  ADMIN_PASSWORD: "REPLACE_FROM_VAULT"
  KEYCLOAK_CLIENT_SECRET: "REPLACE_FROM_VAULT"
  SEAWEEDFS_ACCESS_KEY: "REPLACE_FROM_VAULT"
  SEAWEEDFS_SECRET_KEY: "REPLACE_FROM_VAULT"

---
apiVersion: v1
kind: Service
metadata:
  name: directus
  namespace: i3-ott
  labels:
    app: directus
spec:
  selector:
    app: directus
  ports:
    - name: http
      port: 8055
      targetPort: 8055
  type: ClusterIP

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: directus
  namespace: i3-ott
  labels:
    app.kubernetes.io/part-of: i3-platform
spec:
  host: cms.i3technologies.co.ke
  to:
    kind: Service
    name: directus
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
