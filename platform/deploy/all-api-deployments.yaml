apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gateway
  namespace: i3-ar
spec:
  replicas: 2
  selector:
    matchLabels: {app: mcp-gateway}
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels: {app: mcp-gateway}
    spec:
      serviceAccountName: i3-ar-sa
      containers:
        - name: mcp-gateway
          image: image-registry.openshift-image-registry.svc:5000/i3-ar/mcp-gateway:latest
          ports: [{containerPort: 8080}]
          envFrom: [{secretRef: {name: i3-ar-secrets}}]
          livenessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /health, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            limits: {cpu: "1", memory: "1Gi"}
            requests: {cpu: "250m", memory: "256Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gateway
  namespace: i3-ar
spec:
  selector: {app: mcp-gateway}
  ports: [{port: 8080, targetPort: 8080, name: http}]
---
