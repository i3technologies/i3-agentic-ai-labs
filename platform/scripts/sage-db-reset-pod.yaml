apiVersion: v1
kind: Pod
metadata:
  name: sage-db-reset
  namespace: i3-ai-lab
spec:
  restartPolicy: Never
  containers:
    - name: reset
      image: busybox
      command: ["sh", "-c", "rm -f /data/webui.db && echo 'sage webui.db deleted'"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: open-webui-data
