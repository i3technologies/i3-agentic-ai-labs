# Allow all pods in i3-pmaas to reach external HTTPS (port 443) and HTTP (80)
# Required for: OCP builds pulling base images, Dawa pulling open-webui image
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-egress
  namespace: i3-pmaas
spec:
  podSelector: {}
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
  policyTypes:
    - Egress
