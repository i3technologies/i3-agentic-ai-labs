# STEP-P1-01: All secrets for litellm are injected via ExternalSecret from OpenBao.
# Do NOT store real credentials in this file — it is checked into git.
# See: platform/model-gateway/litellm/external-secret.yaml for the live ExternalSecret resource.
#
# To patch manually during local development, retrieve values from OpenBao:
#   vault kv get i3/langfuse/public-key
#   vault kv get i3/langfuse/secret-key
#   vault kv get i3/litellm/api-key
#   vault kv get i3/watsonx/api-key
#   vault kv get i3/litellm/database-url
#
# OpenBao KV v2 paths:
#   i3/langfuse/public-key   → LANGFUSE_PUBLIC_KEY
#   i3/langfuse/secret-key   → LANGFUSE_SECRET_KEY
#   i3/litellm/api-key       → LITELLM_MASTER_KEY
#   i3/watsonx/api-key       → WATSONX_API_KEY
#   i3/watsonx/project-id    → WATSONX_PROJECT_ID
#   i3/litellm/database-url  → DATABASE_URL
