apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: voice-ingress
  namespace: i3-voice
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-ai-lab
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-evalos
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-pmaas
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-engage
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-smartlab
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
      ports:
        - port: 8000
          protocol: TCP
        - port: 8001
          protocol: TCP
