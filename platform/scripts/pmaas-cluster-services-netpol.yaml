# Allow all pods in i3-pmaas to reach:
#   - OCP internal image registry (port 5000)
#   - Kubernetes API server (port 443, for build pod status reporting)
#   - DNS (already covered but explicit here)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-services-egress
  namespace: i3-pmaas
spec:
  podSelector: {}
  egress:
    # OCP internal image registry
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-image-registry
      ports:
        - protocol: TCP
          port: 5000
    # Kubernetes API (build pods report status here)
    - to:
        - ipBlock:
            cidr: 172.21.0.0/16
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    # DNS
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
  policyTypes:
    - Egress
