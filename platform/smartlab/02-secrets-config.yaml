# ============================================================
# i3 SmartLab — Secrets & ConfigMap
# SCRUBBED (STEP-P1-01): all plaintext credentials removed.
# Retrieve at runtime via OpenBao:
#   DB_PASSWORD       → vault kv get -field=password  i3/smartlab/db
#   DATABASE_URL      → vault kv get -field=url        i3/smartlab/db-url
#   LITELLM_API_KEY   → vault kv get -field=key        i3/litellm/api-key
#   S3_SECRET_KEY     → vault kv get -field=secret     i3/smartlab/s3
#   MOODLE_PASSWORD   → vault kv get -field=password   i3/smartlab/moodle-admin
#   N8N_API_KEY       → vault kv get -field=key        i3/smartlab/n8n
#   DIRECTUS_ADMIN_TOKEN → vault kv get -field=token   i3/smartlab/directus
#   SECRET_KEY        → vault kv get -field=key        i3/smartlab/jwt-secret
# Apply via deploy.ps1 which injects values from OpenBao at apply time.
# ============================================================

# Smartlab core secrets
apiVersion: v1
kind: Secret
metadata:
  name: smartlab-secrets
  namespace: i3-smartlab
  labels:
    app.kubernetes.io/part-of: i3-platform
    app.kubernetes.io/component: smartlab
type: Opaque
stringData:
  # Database — values injected from OpenBao at deploy time
  DB_HOST: "i3-postgres-ha.i3-data.svc"
  DB_PORT: "5432"
  DB_NAME: "smartlab_db"
  DB_USER: "smartlab"
  DB_PASSWORD: ""          # vault kv get -field=password i3/smartlab/db
  DATABASE_URL: ""         # vault kv get -field=url      i3/smartlab/db-url

  # AI Gateway
  LITELLM_BASE_URL: "http://litellm-proxy.i3-model-gateway.svc:4000"
  LITELLM_API_KEY: ""      # vault kv get -field=key      i3/litellm/api-key
  LITELLM_VIRTUAL_KEY: ""  # vault kv get -field=vkey     i3/smartlab/litellm-vkey

  # Voice services
  STT_BASE_URL: "http://voice-stt.i3-voice.svc:8001"
  TTS_BASE_URL: "http://voice-tts.i3-voice.svc:8000"

  # SeaweedFS S3 (object storage)
  S3_ENDPOINT: "http://seaweedfs-s3.i3-ott.svc:8333"
  S3_ACCESS_KEY: "i3smartlab"
  S3_SECRET_KEY: ""        # vault kv get -field=secret   i3/smartlab/s3
  S3_BUCKET_CONTENT: "smartlab-content"
  S3_BUCKET_SCORM: "smartlab-scorm"
  S3_BUCKET_VIDEO: "smartlab-video"
  S3_BUCKET_EPUB: "smartlab-epub"

  # Directus CMS
  DIRECTUS_URL: "http://directus.i3-ott.svc:8055"
  DIRECTUS_ADMIN_TOKEN: "" # vault kv get -field=token    i3/smartlab/directus

  # Moodle (i3EduBridge)
  MOODLE_URL: "http://edbridge.i3-edbridge.svc:80"
  MOODLE_EXTERNAL_URL: "https://moodle.i3technologies.co.ke"
  MOODLE_WS_TOKEN: ""      # vault kv get -field=ws-token i3/smartlab/moodle-admin
  MOODLE_USERNAME: "i3admin"
  MOODLE_PASSWORD: ""      # vault kv get -field=password i3/smartlab/moodle-admin

  # n8n automation
  N8N_URL: "http://n8n.i3-ott.svc:5678"
  N8N_API_KEY: ""          # vault kv get -field=key      i3/smartlab/n8n

  # Keycloak OIDC
  KEYCLOAK_URL: "https://sso.i3technologies.co.ke/auth"
  KEYCLOAK_REALM: "i3"
  KEYCLOAK_CLIENT_ID: "i3smartlab"
  KEYCLOAK_CLIENT_SECRET: ""   # populated after Keycloak client creation

  # OpenBao / Vault (stream key management)
  VAULT_ADDR: "http://openbao-active.i3-security.svc:8200"
  VAULT_TOKEN: ""   # populated after Vault policy creation

  # App
  SECRET_KEY: ""           # vault kv get -field=key      i3/smartlab/jwt-secret
  ENVIRONMENT: "production"
  ALLOWED_ORIGINS: "https://author.i3technologies.co.ke,https://moodle.i3technologies.co.ke"
---
# SmartLab ConfigMap — non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: smartlab-config
  namespace: i3-smartlab
  labels:
    app.kubernetes.io/part-of: i3-platform
    app.kubernetes.io/component: smartlab
data:
  # AI model routing
  MODEL_OUTLINE: "qwen-fast"
  MODEL_CONTENT: "qwen-fast"
  MODEL_ENRICH: "qwen-heavy"
  MODEL_VISION: "vision"
  MODEL_CODE: "coder"
  MODEL_EMBED: "embed"
  MODEL_TUTOR: "granite-nano"

  # SCORM defaults
  SCORM_DEFAULT_VERSION: "2004"
  SCORM_ORG_NAME: "i3 Technologies"
  SCORM_MASTERY_SCORE: "80"

  # Content generation limits
  MAX_MODULES_PER_COURSE: "20"
  MAX_LESSONS_PER_MODULE: "10"
  MAX_QUIZ_QUESTIONS: "20"
  AI_TIMEOUT_FAST: "30"
  AI_TIMEOUT_HEAVY: "180"

  # Streaming
  LIVE_RTMP_SERVER: "rtmp://149.81.34.82:1935/live"
  HLS_CDN_BASE: "https://cdn.i3technologies.co.ke/hls"
  VOD_CDN_BASE: "https://cdn.i3technologies.co.ke/vod"

  # xAPI LRS
  XAPI_ENDPOINT: "https://langfuse.i3technologies.co.ke/api/public"
  XAPI_VERSION: "1.0.3"

  # File limits
  MAX_VIDEO_SIZE_MB: "2048"
  MAX_DOCUMENT_SIZE_MB: "50"
  SUPPORTED_VIDEO_FORMATS: "mp4,mov,avi,mkv,webm"
  SUPPORTED_DOC_FORMATS: "pdf,docx,pptx,md,txt"
