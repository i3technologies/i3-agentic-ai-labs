# ============================================================
# EvalOS Web — Full OpenShift Deployment
# Components: Secret, BuildConfig, ImageStream, Deployment, Service, Route
# Namespace: i3-evalos
# Image: de.icr.io/i3-platform/evalos-web:latest
# Apply: oc apply -f platform/evalos/evalos-web-deploy.yaml
# ============================================================

---
# ── NEXTAUTH secret ───────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: evalos-web-secrets
  namespace: i3-evalos
type: Opaque
stringData:
  NEXTAUTH_SECRET: ""  # SCRUBBED (STEP-P1-01): oc get secret evalos-web-secrets -n i3-evalos -o jsonpath='{.data.NEXTAUTH_SECRET}' | base64 -d
  DATABASE_URL: ""  # SCRUBBED (STEP-P1-01): retrieve via — oc get secret evalos-web-secrets -n i3-evalos -o jsonpath='{.data.DATABASE_URL}' | base64 -d
  NEXTAUTH_URL: "https://evalos.i3technologies.co.ke"
  KEYCLOAK_ISSUER: "https://sso.i3technologies.co.ke/auth/realms/i3"
  KEYCLOAK_CLIENT_ID: "evalos-spa"
  # LiteLLM gateway — sole AI inference path for Study Coach (R1).
  # Direct-Ollama fallback removed (R1-01). LiteLLM router handles model-level
  # fallbacks internally (qwen-fast → granite-nano).
  # LITELLM_KEY: inject via secretKeyRef → secret: litellm-api-secret, key: api-key
  # OpenBao path: i3/litellm/api-key  (per-service virtual key, not master key)
  LITELLM_URL: "http://litellm-proxy.i3-model-gateway.svc.cluster.local:4000"
  LITELLM_MODEL: "qwen-fast"

---
# ── ImageStream ───────────────────────────────────────────────
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: evalos-web
  namespace: i3-evalos
  labels:
    app: evalos-web
    app.kubernetes.io/part-of: i3-platform
spec:
  lookupPolicy:
    local: false

---
# ── BuildConfig (Docker strategy, source from git) ───────────
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: evalos-web
  namespace: i3-evalos
  labels:
    app: evalos-web
    app.kubernetes.io/part-of: i3-platform
spec:
  source:
    type: Git
    git:
      uri: https://github.com/i3technologies/i3-agentic-ai-labs.git
      ref: main
    contextDir: platform/evalos/web
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: DockerImage
      name: de.icr.io/i3-platform/evalos-web:latest
    pushSecret:
      name: icr-pull-secret
  triggers:
    - type: ConfigChange
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

---
# ── Deployment ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalos-web
  namespace: i3-evalos
  labels:
    app: evalos-web
    app.kubernetes.io/part-of: i3-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evalos-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: evalos-web
    spec:
      imagePullSecrets:
        - name: icr-pull-secret
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
      containers:
        - name: evalos-web
          image: de.icr.io/i3-platform/evalos-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: evalos-web-secrets
          env:
            - name: PG_CA_CERT_PATH
              value: /etc/ssl/certs/postgres-ca.crt
            # LITELLM_KEY is already present in evalos-web-secrets and loaded via envFrom above
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/ssl/certs/postgres-ca.crt
              subPath: ca.crt
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: postgres-ca
          secret:
            secretName: crunchy-postgres-ca

---
# ── Service ───────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: evalos-web
  namespace: i3-evalos
  labels:
    app: evalos-web
spec:
  selector:
    app: evalos-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP

---
# ── Route ─────────────────────────────────────────────────────
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: evalos-public
  namespace: i3-evalos
  annotations:
    # Raise HAProxy timeout to 120 s — LLM inference on CPU needs 60-90 s
    haproxy.router.openshift.io/timeout: "120s"
  labels:
    app: evalos-web
spec:
  host: evalos.i3technologies.co.ke
  to:
    kind: Service
    name: evalos-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
