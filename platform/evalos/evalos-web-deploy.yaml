# ============================================================
# EvalOS Web — Full OpenShift Deployment
# Components: Secret, BuildConfig, ImageStream, Deployment, Service, Route
# Namespace: i3-evalos
# Image: de.icr.io/i3-platform/evalos-web:latest
# Apply: oc apply -f platform/evalos/evalos-web-deploy.yaml
# ============================================================

---
# ── NEXTAUTH secret ───────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: evalos-web-secrets
  namespace: i3-evalos
type: Opaque
stringData:
  # NEXTAUTH_SECRET must be a random 32-byte hex string.
  # Generate: openssl rand -hex 32
  # Populate before applying: oc create secret generic evalos-web-secrets \
  #   --from-literal=NEXTAUTH_SECRET=$(openssl rand -hex 32) --dry-run=client -o yaml | oc apply -f -
  # LEAVING THIS EMPTY WILL CAUSE A SERVER-SIDE EXCEPTION ON EVERY PAGE LOAD.
  NEXTAUTH_SECRET: ""  # ⚠️  MUST be populated in cluster — never commit the real value
  # DATABASE_URL: retrieve via OpenBao i3/evalos/db-url or Crunchy secret
  DATABASE_URL: ""  # ⚠️  MUST be populated in cluster
  NEXTAUTH_URL: "https://evalos.i3technologies.co.ke"
  # IMPORTANT: Keycloak 17+ dropped the /auth prefix from realm URLs.
  # Use /realms/i3, NOT /auth/realms/i3 — the old path returns 404 which
  # causes NextAuth OIDC discovery to fail with a server-side exception.
  KEYCLOAK_ISSUER: "https://sso.i3technologies.co.ke/realms/i3"
  KEYCLOAK_CLIENT_ID: "evalos-spa"
  # LiteLLM gateway — sole AI inference path for Study Coach (R1).
  # Direct-Ollama fallback removed (R1-01). LiteLLM router handles model-level
  # fallbacks internally (qwen-fast → granite-nano).
  # LITELLM_KEY is injected from litellm-api-secret via env[] below (not here).
  # OpenBao path: i3/litellm/api-key  (per-service virtual key, not master key)
  LITELLM_URL: "http://litellm-proxy.i3-model-gateway.svc.cluster.local:4000"
  LITELLM_MODEL: "qwen-fast"

---
# ── ImageStream ───────────────────────────────────────────────
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: evalos-web
  namespace: i3-evalos
  labels:
    app: evalos-web
    app.kubernetes.io/part-of: i3-platform
spec:
  lookupPolicy:
    local: false

---
# ── BuildConfig (Docker strategy, source from git) ───────────
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: evalos-web
  namespace: i3-evalos
  labels:
    app: evalos-web
    app.kubernetes.io/part-of: i3-platform
spec:
  source:
    type: Git
    git:
      uri: https://github.com/i3technologies/i3-agentic-ai-labs.git
      ref: main
    contextDir: platform/evalos/web
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: DockerImage
      name: de.icr.io/i3-platform/evalos-web:latest
    pushSecret:
      name: icr-pull-secret
  triggers:
    - type: ConfigChange
  resources:
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

---
# ── Deployment ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: evalos-web
  namespace: i3-evalos
  labels:
    app: evalos-web
    app.kubernetes.io/part-of: i3-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evalos-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: evalos-web
    spec:
      imagePullSecrets:
        - name: icr-pull-secret
      securityContext:
        runAsUser: 1001
        runAsNonRoot: true
      containers:
        - name: evalos-web
          image: de.icr.io/i3-platform/evalos-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: evalos-web-secrets
          env:
            - name: PG_CA_CERT_PATH
              value: /etc/ssl/certs/postgres-ca.crt
            # LITELLM_KEY injected from the shared litellm-api-secret (OpenBao path: i3/litellm/api-key)
            - name: LITELLM_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-api-secret
                  key: api-key
                  optional: true   # allows Pod to start even before litellm secret is created
          volumeMounts:
            - name: postgres-ca
              mountPath: /etc/ssl/certs/postgres-ca.crt
              subPath: ca.crt
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: postgres-ca
          secret:
            secretName: crunchy-postgres-ca

---
# ── Service ───────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: evalos-web
  namespace: i3-evalos
  labels:
    app: evalos-web
spec:
  selector:
    app: evalos-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP

---
# ── Route ─────────────────────────────────────────────────────
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: evalos-public
  namespace: i3-evalos
  annotations:
    # Raise HAProxy timeout to 120 s — LLM inference on CPU needs 60-90 s
    haproxy.router.openshift.io/timeout: "120s"
  labels:
    app: evalos-web
spec:
  host: evalos.i3technologies.co.ke
  to:
    kind: Service
    name: evalos-web
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
