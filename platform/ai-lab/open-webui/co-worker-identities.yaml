# ── Nuru — i3-Engage Campaign Manager (i3-engage namespace) ──
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-nuru-config
  namespace: i3-engage
  labels:
    app: open-webui
    instance: nuru
data:
  WEBUI_NAME: "Nuru — Campaign Manager"
  WEBUI_URL: "https://nuru.i3technologies.co.ke"
  DEFAULT_MODELS: "qwen-fast"
  ENABLE_SIGNUP: "false"
  ENABLE_LOGIN_FORM: "false"
  ENABLE_OAUTH_SIGNUP: "true"
  OAUTH_PROVIDER_NAME: "i3-Engage SSO"
  OPENID_PROVIDER_URL: "https://auth.i3technologies.co.ke/realms/engage/.well-known/openid-configuration"
  OAUTH_SCOPES: "openid email profile"
  OPENAI_API_BASE_URL: "http://litellm-proxy.i3-model-gateway.svc.cluster.local:4000/v1"
  VECTOR_DB: "chroma"
  CHROMA_HTTP_HOST: "chromadb.i3-ai-lab.svc.cluster.local"
  CHROMA_HTTP_PORT: "8000"
  CHROMA_COLLECTION: "engage-brand-kb"
  DEFAULT_SYSTEM_PROMPT: |
    You are Nuru, an expert digital marketing and customer engagement AI for i3-Engage. You
    help marketing teams and customer success managers with:
    - Building precise customer segments ("show me churned customers in Nairobi, last 90 days")
    - Writing compliant, on-brand SMS (160 chars max), WhatsApp, and email content
    - Designing A/B test variants for campaigns
    - Interpreting campaign analytics and recommending optimisations
    - Churn prediction and win-back campaign strategies
    Always write content that is compliant with DPA Kenya and WhatsApp Business Policy.
    SMS messages must be under 160 characters. Be concise, data-driven, and action-oriented.

