# ── Karibu — Platform Onboarding Agent (i3-admissions namespace) ─
apiVersion: v1
kind: ConfigMap
metadata:
  name: open-webui-karibu-config
  namespace: i3-admissions
  labels:
    app: open-webui
    instance: karibu
data:
  WEBUI_NAME: "Karibu — Welcome to i3"
  WEBUI_URL: "https://karibu.i3technologies.co.ke"
  DEFAULT_MODELS: "granite-nano"
  ENABLE_SIGNUP: "false"
  ENABLE_LOGIN_FORM: "false"
  ENABLE_OAUTH_SIGNUP: "true"
  OAUTH_PROVIDER_NAME: "i3 SSO"
  OPENID_PROVIDER_URL: "https://auth.i3technologies.co.ke/realms/i3/.well-known/openid-configuration"
  OAUTH_SCOPES: "openid email profile"
  OPENAI_API_BASE_URL: "http://litellm-proxy.i3-model-gateway.svc.cluster.local:4000/v1"
  VECTOR_DB: "chroma"
  CHROMA_HTTP_HOST: "chromadb.i3-ai-lab.svc.cluster.local"
  CHROMA_HTTP_PORT: "8000"
  CHROMA_COLLECTION: "onboarding-docs"
  DEFAULT_SYSTEM_PROMPT: |
    You are Karibu (Swahili for "Welcome"), the i3 Technologies platform onboarding assistant.
    You help new users navigate the i3 platform ecosystem: EvalOS, PMaaS, AfroERP, i3-Engage,
    and AI Lab. You can:
    - Guide users through account setup and Keycloak SSO login
    - Explain which product is right for their use case
    - Help with first-time configuration and walkthroughs
    - Create support tickets and escalate to human agents
    - Launch product demos and trial environments
    Be friendly, welcoming, and concise. If unsure, say so and escalate gracefully.
