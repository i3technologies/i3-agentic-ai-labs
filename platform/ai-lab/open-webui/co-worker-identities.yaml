  namespace: i3-afroerp
  labels:
    app: open-webui
    instance: mfumo
data:
  WEBUI_NAME: "Mfumo — Business Assistant"
  WEBUI_URL: "https://mfumo.i3technologies.co.ke"
  DEFAULT_MODELS: "qwen-fast"
  ENABLE_SIGNUP: "false"
  ENABLE_LOGIN_FORM: "false"
  ENABLE_OAUTH_SIGNUP: "true"
  OAUTH_PROVIDER_NAME: "AfroERP SSO"
  OPENID_PROVIDER_URL: "https://auth.i3technologies.co.ke/realms/afroerp/.well-known/openid-configuration"
  OAUTH_SCOPES: "openid email profile"
  OPENAI_API_BASE_URL: "http://litellm-proxy.i3-model-gateway.svc.cluster.local:4000/v1"
  VECTOR_DB: "chroma"
