# ============================================================
# ChromaDB — Vector Store for RAG Pipelines
# Namespace: i3-ai-lab
# Collections:
#   - i3-exam-corpus       (EvalOS question + explanation bank)
#   - onboarding-docs      (i3 platform docs, HR, EvalOS how-to)
#   - pmaas-manifesto      (PMaaS candidate manifestos, per campaign)
#   - afroerp-kb           (ERPNext docs, KRA guidelines, i3 SOPs)
#   - engage-brand-kb      (per-tenant brand voice, product catalogue)
# ============================================================

# ── PVC: vector data persistent storage ──────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chromadb-data
  namespace: i3-ai-lab
  labels:
    app: chromadb
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

---
# ── ConfigMap: ChromaDB log config (stdout-only, no file handler) ─
apiVersion: v1
kind: ConfigMap
metadata:
  name: chromadb-log-config
  namespace: i3-ai-lab
data:
  log_config.yml: |
    version: 1
    disable_existing_loggers: false
    formatters:
      default:
        "()": uvicorn.logging.DefaultFormatter
        fmt: "%(levelprefix)s %(message)s"
        use_colors: null
    handlers:
      default:
        formatter: default
        class: logging.StreamHandler
        stream: ext://sys.stderr
    loggers:
      uvicorn:
        handlers: [default]
        level: INFO
        propagate: false
      uvicorn.error:
        level: INFO
      uvicorn.access:
        handlers: [default]
        level: INFO
        propagate: false
      chromadb:
        handlers: [default]
        level: INFO
        propagate: false

---
# ── StatefulSet: ChromaDB ─────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chromadb
  namespace: i3-ai-lab
  labels:
    app: chromadb
    app.kubernetes.io/part-of: i3-platform
spec:
  serviceName: chromadb
  replicas: 1
  selector:
    matchLabels:
      app: chromadb
  template:
    metadata:
      labels:
        app: chromadb
    spec:
      containers:
        - name: chromadb
          image: chromadb/chroma:0.5.0
          imagePullPolicy: IfNotPresent
          command:
            - uvicorn
            - chromadb.app:app
            - --workers=1
            - --host=0.0.0.0
            - --port=8000
            - --proxy-headers
            - --log-config=/etc/chromadb/log_config.yml
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: IS_PERSISTENT
              value: "TRUE"
            - name: PERSIST_DIRECTORY
              value: "/chroma/chroma"
            - name: ANONYMIZED_TELEMETRY
              value: "False"
            # Override uvicorn log config to prevent file handler (OpenShift read-only fs)
            - name: CHROMA_LOG_CONFIG_FILE
              value: "/etc/chromadb/log_config.yml"
            - name: LOG_CONFIG
              value: "/etc/chromadb/log_config.yml"
            # Token auth (set matching CHROMA_TOKEN in consumers)
            - name: CHROMA_SERVER_AUTHN_PROVIDER
              value: "chromadb.auth.token_authn.TokenAuthenticationServerProvider"
            - name: CHROMA_SERVER_AUTHN_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: chromadb-secrets
                  key: CHROMA_TOKEN
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /chroma/chroma
            - name: log-config
              mountPath: /etc/chromadb
              readOnly: true
          livenessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/v1/heartbeat
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: chromadb-data
        - name: log-config
          configMap:
            name: chromadb-log-config

---
# ── Service: ClusterIP (internal only) ───────────────────────
apiVersion: v1
kind: Service
metadata:
  name: chromadb
  namespace: i3-ai-lab
  labels:
    app: chromadb
spec:
  selector:
    app: chromadb
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  clusterIP: None  # headless for StatefulSet DNS

---
# ── Secret: ChromaDB auth token ──────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: chromadb-secrets
  namespace: i3-ai-lab
  labels:
    app: chromadb
type: Opaque
stringData:
  # Generate: openssl rand -hex 32
  CHROMA_TOKEN: "fb4a0f0b619b6517d1b1082f5254b3c52c909221ab757f51bbc1c6a154a2c98c"

---
# ── NetworkPolicy: restrict ChromaDB access ──────────────────
# Only allow: onboarding-agent, open-webui, embedding-job
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chromadb-ingress
  namespace: i3-ai-lab
spec:
  podSelector:
    matchLabels:
      app: chromadb
  ingress:
    - from:
        # Open WebUI (Sage + all co-workers)
        - podSelector:
            matchLabels:
              app: open-webui
        # Embedding pipeline job
        - podSelector:
            matchLabels:
              app: embedding-pipeline
        # Onboarding agent (i3-admissions)
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-admissions
        # EvalOS Study Coach
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-evalos
      ports:
        - protocol: TCP
          port: 8000
  policyTypes:
    - Ingress
