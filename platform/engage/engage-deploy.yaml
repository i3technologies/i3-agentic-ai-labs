# ============================================================
# i3-Engage Cloud — Customer 360 CDP + Omnichannel Messaging
# Namespace: i3-engage
# Components:
#   - Engage Web (Next.js) — CDP dashboard
#   - Campaign AI Agent (LangGraph) — autonomous campaign mgmt
#   - Nuru Co-worker (Open WebUI)
#   - PostgreSQL DB (engage_db via pgbouncer + i3-data)
#   - Kafka consumers: SMS / WhatsApp / Email event streams
# ============================================================

# ── Namespace ────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: i3-engage
  labels:
    kubernetes.io/metadata.name: i3-engage
    app.kubernetes.io/part-of: i3-platform

---
# ── ResourceQuota ─────────────────────────────────────────────
apiVersion: v1
kind: ResourceQuota
metadata:
  name: engage-quota
  namespace: i3-engage
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "6Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"

---
# ── Secret: i3-Engage credentials ────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: engage-secrets
  namespace: i3-engage
  labels:
    app.kubernetes.io/part-of: i3-platform
type: Opaque
stringData:
  DATABASE_URL: "postgresql://engage:REPLACE@i3-postgres-pgbouncer.i3-data.svc:5432/engage_db?pgbouncer=true&connection_limit=10"
  NEXTAUTH_SECRET: "5/5acuPp23ZT9+FEP8gnyE2q1HVbD1VLnjIo0TiCHLE="
  NEXTAUTH_URL: "https://engage.i3technologies.co.ke"
  KEYCLOAK_ISSUER: "https://sso.i3technologies.co.ke/auth/realms/i3"
  KEYCLOAK_CLIENT_ID: "engage-web"
  KEYCLOAK_CLIENT_SECRET: "bJiIyXsPpY0phWvUzbQCWCVCF4oDBZOI"
  # LiteLLM gateway for AI agents
  LITELLM_URL: "http://litellm-proxy.i3-model-gateway.svc.cluster.local:4000/v1"
  LITELLM_KEY: "sk-litellm-i3-f951c9377163a11275864cb92e90ad13"
  # ChromaDB for brand knowledge base
  CHROMA_HOST: "chromadb.i3-ai-lab.svc.cluster.local"
  CHROMA_TOKEN: "fb4a0f0b619b6517d1b1082f5254b3c52c909221ab757f51bbc1c6a154a2c98c"
  # Kafka
  KAFKA_BOOTSTRAP: "kafka-bootstrap.i3-messaging.svc.cluster.local:9092"
  # Africa's Talking (SMS)
  AT_API_KEY: "REPLACE_WITH_AT_API_KEY"
  AT_USERNAME: "REPLACE"
  # WhatsApp Business Cloud API
  WHATSAPP_TOKEN: "REPLACE_WITH_META_TOKEN"
  WHATSAPP_PHONE_NUMBER_ID: "REPLACE"
  WHATSAPP_VERIFY_TOKEN: "REPLACE_WITH_WEBHOOK_VERIFY_TOKEN"
  # Brevo (Email — existing, reused from EvalOS)
  BREVO_API_KEY: "REPLACE_WITH_BREVO_KEY"
  # M-Pesa (payment links in messages)
  MPESA_CONSUMER_KEY: "REPLACE"
  MPESA_CONSUMER_SECRET: "REPLACE"

---
# ── Deployment: Engage Web (Next.js) ─────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: engage-web
  namespace: i3-engage
  labels:
    app: engage-web
    app.kubernetes.io/part-of: i3-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: engage-web
  template:
    metadata:
      labels:
        app: engage-web
    spec:
      containers:
        - name: engage-web
          image: image-registry.openshift-image-registry.svc:5000/i3-engage/engage-web:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: engage-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15

---
apiVersion: v1
kind: Service
metadata:
  name: engage-web
  namespace: i3-engage
  labels:
    app: engage-web
spec:
  selector:
    app: engage-web
  ports:
    - port: 3000
      targetPort: 3000

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: engage-web
  namespace: i3-engage
  labels:
    app.kubernetes.io/part-of: i3-platform
spec:
  host: engage.i3technologies.co.ke
  to:
    kind: Service
    name: engage-web
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

---
# ── Deployment: Campaign AI Agent (LangGraph) ─────────────────
# Handles: segment building, content generation, A/B monitoring,
# send-time optimisation, churn prediction, campaign lifecycle
apiVersion: apps/v1
kind: Deployment
metadata:
  name: campaign-agent
  namespace: i3-engage
  labels:
    app: campaign-agent
    app.kubernetes.io/part-of: i3-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campaign-agent
  template:
    metadata:
      labels:
        app: campaign-agent
    spec:
      containers:
        - name: agent
          image: image-registry.openshift-image-registry.svc:5000/i3-engage/campaign-agent:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: engage-secrets
          env:
            - name: LITELLM_MODEL_FAST
              value: "qwen-fast"
            - name: LITELLM_MODEL_HEAVY
              value: "qwen-heavy"
            - name: CHROMA_COLLECTION
              value: "engage-brand-kb"
            - name: KAFKA_TOPIC_SMS
              value: "engage.sms-events"
            - name: KAFKA_TOPIC_WHATSAPP
              value: "engage.whatsapp-events"
            - name: KAFKA_TOPIC_EMAIL
              value: "engage.email-events"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"

---
apiVersion: v1
kind: Service
metadata:
  name: campaign-agent
  namespace: i3-engage
  labels:
    app: campaign-agent
spec:
  selector:
    app: campaign-agent
  ports:
    - port: 8080
      targetPort: 8080

---
# ── Deployment: Kafka Consumer — SMS events ───────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-consumer
  namespace: i3-engage
  labels:
    app: sms-consumer
    app.kubernetes.io/part-of: i3-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sms-consumer
  template:
    metadata:
      labels:
        app: sms-consumer
    spec:
      containers:
        - name: consumer
          image: image-registry.openshift-image-registry.svc:5000/i3-engage/kafka-consumers:latest
          imagePullPolicy: Always
          command: ["python3", "consumers/sms_consumer.py"]
          envFrom:
            - secretRef:
                name: engage-secrets
          env:
            - name: CONSUMER_GROUP
              value: "engage-sms-consumer"
            - name: KAFKA_TOPIC
              value: "engage.sms-events"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
# ── Deployment: Nuru Co-worker (Open WebUI) ──────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nuru-coworker
  namespace: i3-engage
  labels:
    app: nuru-coworker
    instance: nuru
    app.kubernetes.io/part-of: i3-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nuru-coworker
      instance: nuru
  template:
    metadata:
      labels:
        app: nuru-coworker
        instance: nuru
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: open-webui-nuru-config   # from co-worker-identities.yaml
            - secretRef:
                name: nuru-open-webui-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"

---
apiVersion: v1
kind: Secret
metadata:
  name: nuru-open-webui-secrets
  namespace: i3-engage
type: Opaque
stringData:
  OPENAI_API_KEY: "sk-litellm-i3-f951c9377163a11275864cb92e90ad13"
  OAUTH_CLIENT_ID: "open-webui-nuru"
  OAUTH_CLIENT_SECRET: "bJiIyXsPpY0phWvUzbQCWCVCF4oDBZOI"
  WEBUI_SECRET_KEY: "5/5acuPp23ZT9+FEP8gnyE2q1HVbD1VLnjIo0TiCHLE="

---
apiVersion: v1
kind: Service
metadata:
  name: nuru-coworker
  namespace: i3-engage
  labels:
    app: nuru-coworker
spec:
  selector:
    app: nuru-coworker
    instance: nuru
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nuru
  namespace: i3-engage
  labels:
    app.kubernetes.io/part-of: i3-platform
spec:
  host: nuru.i3technologies.co.ke
  to:
    kind: Service
    name: nuru-coworker
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

---
# ── WhatsApp Webhook Route (public endpoint for Meta) ─────────
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: whatsapp-webhook
  namespace: i3-engage
  labels:
    app.kubernetes.io/part-of: i3-platform
spec:
  host: engage-webhook.i3technologies.co.ke
  path: /webhook/whatsapp
  to:
    kind: Service
    name: engage-web
  port:
    targetPort: 3000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
