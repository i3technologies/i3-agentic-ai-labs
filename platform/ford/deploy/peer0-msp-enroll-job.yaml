# ============================================================
# peer0-i3tech MSP enroll Job — P3-GATE-05 prerequisite
#
# Runs fabric-ca-client to:
#   1. Enroll as CA admin
#   2. Register the peer0 identity (idempotent — skip if exists)
#   3. Enroll peer0 MSP into /var/hyperledger/production/msp
#      which is the peer0-i3tech-pvc mounted at that path
#
# Run ONCE before (or alongside) the peer Deployment.
# Apply: kubectl apply -f platform/ford/deploy/peer0-msp-enroll-job.yaml
#        kubectl wait --for=condition=complete job/peer0-msp-enroll -n i3-ford --timeout=120s
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: peer0-msp-enroll
  namespace: i3-ford
  labels:
    app: peer0-i3tech
    job: msp-enroll
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: peer0-i3tech
        job: msp-enroll
    spec:
      serviceAccountName: ford-sa
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 7051
        runAsNonRoot: true
        fsGroup: 7051
      initContainers:
        # Step 1: enroll admin, register peer0 identity (idempotent)
        - name: register-peer
          image: hyperledger/fabric-ca:1.5.9
          command:
            - sh
            - -c
            - |
              set -e
              export FABRIC_CA_CLIENT_HOME=/tmp/admin
              # Enroll admin
              fabric-ca-client enroll \
                -u http://admin:adminpw@ford-ca.i3-ford.svc.cluster.local:7054 \
                --caname ford-ca
              # Register peer0 (ignore error if already registered)
              fabric-ca-client register \
                --id.name peer0 \
                --id.secret peer0pw \
                --id.type peer \
                --caname ford-ca || true
      containers:
        # Step 2: enroll peer0 MSP into the shared PVC
        - name: enroll-peer
          image: hyperledger/fabric-ca:1.5.9
          command:
            - sh
            - -c
            - |
              set -e
              export FABRIC_CA_CLIENT_HOME=/tmp/admin
              # Re-enroll admin for signing authority
              fabric-ca-client enroll \
                -u http://admin:adminpw@ford-ca.i3-ford.svc.cluster.local:7054 \
                --caname ford-ca
              # Enroll peer0 identity into the production volume
              FABRIC_CA_CLIENT_HOME=/var/hyperledger/production \
              fabric-ca-client enroll \
                -u http://peer0:peer0pw@ford-ca.i3-ford.svc.cluster.local:7054 \
                --caname ford-ca \
                -M /var/hyperledger/production/msp
              echo "MSP enrollment complete"
              ls -la /var/hyperledger/production/msp/
          volumeMounts:
            - mountPath: /var/hyperledger/production
              name: peer-data
      volumes:
        - name: peer-data
          persistentVolumeClaim:
            claimName: peer0-i3tech-pvc
