# ford-channel join Job - P3-GATE-06
#
# Prerequisite: peer0-msp-init Job must have completed.
#
# Apply:
#   kubectl apply -f platform/ford/deploy/channel-join-job.yaml
#   kubectl wait --for=condition=complete job/ford-channel-join -n i3-ford --timeout=180s
#   kubectl logs job/ford-channel-join -n i3-ford
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: ford-channel-join
  namespace: i3-ford
  labels:
    app: peer0-i3tech
    job: channel-join
    gate: P3-GATE-06
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: peer0-i3tech
        job: channel-join
    spec:
      serviceAccountName: ford-sa
      restartPolicy: OnFailure
      volumes:
        - name: orderer-tls-ca
          configMap:
            name: orderer-tls-ca
      containers:
        - name: channel-join
          image: bitnami/kubectl:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: orderer-tls-ca
              mountPath: /orderer-tls
              readOnly: true
          command:
            - sh
            - -c
            - >-
              set -e;
              CHANNEL_ID=ford-channel;
              ORDERER_ADDR=orderer.i3-ford.svc.cluster.local:7050;
              PEER_POD=$(kubectl get pod -n i3-ford -l app=peer0-i3tech -o jsonpath='{.items[0].metadata.name}');
              if [ -z "$PEER_POD" ]; then echo ERROR peer0-i3tech not found; exit 1; fi;
              echo "Using peer pod $PEER_POD";
              kubectl cp /orderer-tls/ca.crt i3-ford/$PEER_POD:/tmp/orderer-tls-ca.crt;
              kubectl exec -n i3-ford "$PEER_POD" -- sh -c
              'export CORE_PEER_LOCALMSPID=FordPeerMSP;
               export CORE_PEER_MSPCONFIGPATH=/var/hyperledger/production/msp;
               export CORE_PEER_ADDRESS=peer0-i3tech.i3-ford.svc.cluster.local:7051;
               export CORE_PEER_TLS_ENABLED=false;
               peer channel fetch 0 /tmp/ford-channel.block -c ford-channel
               -o orderer.i3-ford.svc.cluster.local:7050
               --tls=true --cafile /tmp/orderer-tls-ca.crt &&
               peer channel join -b /tmp/ford-channel.block &&
               peer channel list | grep ford-channel &&
               echo P3-GATE-06-PASS'
---
# membership-registry Chaincode Deploy Job - P3-GATE-07
#
# Prerequisite: ford-channel-join Job must have completed.
#
# Apply after ford-channel-join completes:
#   kubectl apply -f platform/ford/deploy/channel-join-job.yaml
#   kubectl wait --for=condition=complete job/ford-chaincode-deploy -n i3-ford --timeout=300s
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: ford-chaincode-deploy
  namespace: i3-ford
  labels:
    app: peer0-i3tech
    job: chaincode-deploy
    gate: P3-GATE-07
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: peer0-i3tech
        job: chaincode-deploy
    spec:
      serviceAccountName: ford-sa
      restartPolicy: OnFailure
      volumes:
        - name: orderer-tls-ca
          configMap:
            name: orderer-tls-ca
      containers:
        - name: chaincode-deploy
          image: bitnami/kubectl:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: orderer-tls-ca
              mountPath: /orderer-tls
              readOnly: true
          command:
            - sh
            - -c
            - >-
              set -e;
              CHANNEL_ID=ford-channel;
              ORDERER_ADDR=orderer.i3-ford.svc.cluster.local:7050;
              PEER_ADDR=peer0-i3tech.i3-ford.svc.cluster.local:7051;
              CC_NAME=membership-registry;
              CC_VERSION=1.0;
              CC_SEQUENCE=1;
              PEER_POD=$(kubectl get pod -n i3-ford -l app=peer0-i3tech -o jsonpath='{.items[0].metadata.name}');
              if [ -z "$PEER_POD" ]; then echo ERROR peer0-i3tech not found; exit 1; fi;
              echo "Using peer pod $PEER_POD";
              kubectl cp /orderer-tls/ca.crt i3-ford/$PEER_POD:/tmp/orderer-tls-ca.crt;
              kubectl cp /workspace/chaincode-src i3-ford/$PEER_POD:/tmp/chaincode;
              kubectl exec -n i3-ford "$PEER_POD" -- sh -c
              'export CORE_PEER_LOCALMSPID=FordPeerMSP;
               export CORE_PEER_MSPCONFIGPATH=/var/hyperledger/production/msp;
               export CORE_PEER_ADDRESS=peer0-i3tech.i3-ford.svc.cluster.local:7051;
               export CORE_PEER_TLS_ENABLED=false;
               peer lifecycle chaincode package /tmp/membership-registry.tar.gz
               --path /tmp/chaincode --lang golang --label membership-registry_1.0 &&
               peer lifecycle chaincode install /tmp/membership-registry.tar.gz';
              PKG_ID=$(kubectl exec -n i3-ford "$PEER_POD" -- sh -c
              'export CORE_PEER_LOCALMSPID=FordPeerMSP;
               export CORE_PEER_MSPCONFIGPATH=/var/hyperledger/production/msp;
               export CORE_PEER_ADDRESS=peer0-i3tech.i3-ford.svc.cluster.local:7051;
               export CORE_PEER_TLS_ENABLED=false;
               peer lifecycle chaincode queryinstalled --output json' |
               python3 -c "import sys,json;
               cc=json.load(sys.stdin).get('installed_chaincodes',[]);
               pkgs=[c['package_id'] for c in cc if 'membership-registry_1.0' in c.get('package_id','')];
               print(pkgs[0] if pkgs else '')");
              echo "Package ID $PKG_ID";
              kubectl exec -n i3-ford "$PEER_POD" -- sh -c
              "export CORE_PEER_LOCALMSPID=FordPeerMSP;
               export CORE_PEER_MSPCONFIGPATH=/var/hyperledger/production/msp;
               export CORE_PEER_ADDRESS=$PEER_ADDR;
               export CORE_PEER_TLS_ENABLED=false;
               peer lifecycle chaincode approveformyorg -o $ORDERER_ADDR
               --channelID $CHANNEL_ID --name $CC_NAME --version $CC_VERSION
               --package-id $PKG_ID --sequence $CC_SEQUENCE
               --tls=true --cafile /tmp/orderer-tls-ca.crt &&
               peer lifecycle chaincode commit -o $ORDERER_ADDR
               --channelID $CHANNEL_ID --name $CC_NAME --version $CC_VERSION
               --sequence $CC_SEQUENCE
               --tls=true --cafile /tmp/orderer-tls-ca.crt --peerAddresses $PEER_ADDR";
              echo P3-GATE-07-PASS
          volumeMounts:
            - mountPath: /workspace/chaincode-src
              name: chaincode-src
            - mountPath: /orderer-tls
              name: orderer-tls-ca
              readOnly: true
      volumes:
        - name: chaincode-src
          configMap:
            name: ford-chaincode-files-raw
            optional: false
        - name: orderer-tls-ca
          configMap:
            name: orderer-tls-ca
