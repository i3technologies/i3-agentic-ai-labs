  mspID: FordPeerMSP
  secret:
    enrollment:
      component:
        cahost: ford-ca.i3-ford.svc.cluster.local
        caport: 7054
        caname: ford-ca
        catls:
          cacert: ${FORD_CA_TLS_CERT}
        enrollid: peer1
        enrollsecret: ${FORD_PEER1_SECRET}
      tls:
        cahost: ford-ca.i3-ford.svc.cluster.local
        caport: 7054
        caname: ford-ca
        catls:
          cacert: ${FORD_CA_TLS_CERT}
        enrollid: peer1tls
        enrollsecret: ${FORD_PEER1_TLS_SECRET}
  stateDb: leveldb
  storage:
    peer:
      size: 10Gi
      storageClass: ibmc-vpc-block-retain-10iops-tier
    chaincode:
      size: 2Gi
      storageClass: ibmc-vpc-block-retain-10iops-tier
  service:
    type: ClusterIP

---
apiVersion: hlf.kungfusoftware.es/v1alpha1
kind: FabricPeer
metadata:
  name: hlf-peer-2
  namespace: i3-ford
  labels:
    app: hlf-peer
spec:
  image: hyperledger/fabric-peer
  version: "2.5.9"
  mspID: FordPeerMSP
  secret:
    enrollment:
      component:
        cahost: ford-ca.i3-ford.svc.cluster.local
        caport: 7054
        caname: ford-ca
        catls:
          cacert: ${FORD_CA_TLS_CERT}
        enrollid: peer2
        enrollsecret: ${FORD_PEER2_SECRET}
      tls:
        cahost: ford-ca.i3-ford.svc.cluster.local
        caport: 7054
        caname: ford-ca
        catls:
          cacert: ${FORD_CA_TLS_CERT}
        enrollid: peer2tls
