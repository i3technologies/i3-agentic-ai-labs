# ============================================================
# Hyperledger Fabric Network — FORD-Asili (HLF Operator on OpenShift)
# Namespace: i3-ford
# HC-2: Fabric staging must be live by November 2026
# HC-8: voteChoicesCollection PDC enforces ballot-secrecy separation
# HC-5: Endorsement policy requires ≥1 FordPeerMSP peer
# ============================================================

# ── Fabric CA ─────────────────────────────────────────────────────────────────
apiVersion: hlf.kungfusoftware.es/v1alpha1
kind: FabricCA
metadata:
  name: ford-ca
  namespace: i3-ford
spec:
  image: hyperledger/fabric-ca
  version: "1.5.9"
  storage:
    size: 2Gi
    storageClass: ibmc-vpc-block-retain-10iops-tier
  service:
    type: ClusterIP
  ca:
    name: ford-ca
    csr:
      cn: ford-ca
      hosts:
        - ford-ca.i3-ford.svc.cluster.local
        - localhost
      names:
        - C: KE
          ST: Nairobi
          L: Nairobi
          O: FORD-Asili
          OU: i3Technologies

---
# ── Peer Node Pool (3 peers for fault tolerance) ─────────────────────────────
apiVersion: hlf.kungfusoftware.es/v1alpha1
kind: FabricPeer
metadata:
  name: hlf-peer-0
  namespace: i3-ford
  labels:
    app: hlf-peer
spec:
  image: hyperledger/fabric-peer
  version: "2.5.9"
  mspID: FordPeerMSP
  secret:
    enrollment:
      component:
        cahost: ford-ca.i3-ford.svc.cluster.local
        caport: 7054
        caname: ford-ca
        catls:
          cacert: ${FORD_CA_TLS_CERT}
        enrollid: peer0
        enrollsecret: ${FORD_PEER0_SECRET}
      tls:
        cahost: ford-ca.i3-ford.svc.cluster.local
        caport: 7054
        caname: ford-ca
        catls:
          cacert: ${FORD_CA_TLS_CERT}
        enrollid: peer0tls
        enrollsecret: ${FORD_PEER0_TLS_SECRET}
  stateDb: leveldb
  storage:
    peer:
      size: 10Gi
      storageClass: ibmc-vpc-block-retain-10iops-tier
    chaincode:
      size: 2Gi
      storageClass: ibmc-vpc-block-retain-10iops-tier
  service:
    type: ClusterIP
  grpcProxy:
    enabled: false

---
apiVersion: hlf.kungfusoftware.es/v1alpha1
kind: FabricPeer
metadata:
  name: hlf-peer-1
  namespace: i3-ford
  labels:
    app: hlf-peer
spec:
  image: hyperledger/fabric-peer
