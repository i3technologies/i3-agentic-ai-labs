# ============================================================
# peer0-i3tech MSP admincerts-only fix — P3-GATE-05
#
# Fabric 2.x supports two MSP validation modes:
#   A) NodeOUs (requires OU ext in x509 cert — needs CA config)
#   B) Admincerts-only — config.yaml has NodeOUs.Enable: false;
#      peer cert in admincerts/ acts as the admin identity.
#
# Mode B is used here because the Fabric CA in i3-ford was
# provisioned without the ou_identifiers config block, so certs
# do not carry the peer/admin OU x509 extension.
#
# Run with peer Deployment scaled to 0.
# ============================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: peer0-msp-fix
  namespace: i3-ford
  labels:
    app: peer0-i3tech
    job: msp-fix
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: peer0-i3tech
        job: msp-fix
    spec:
      serviceAccountName: ford-sa
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 7051
        runAsNonRoot: true
        fsGroup: 7051
      containers:
        - name: msp-fix
          image: hyperledger/fabric-ca:1.5.9
          command:
            - sh
            - -c
            - |
              set -e
              MSP="/var/hyperledger/production/msp"
              ADMIN_HOME="/tmp/admin"
              export FABRIC_CA_CLIENT_HOME="${ADMIN_HOME}"

              echo "=== Enroll CA admin ==="
              fabric-ca-client enroll \
                -u "http://admin:adminpw@ford-ca.i3-ford.svc.cluster.local:7054" \
                --caname ford-ca

              echo "=== Register peer0 (idempotent) ==="
              fabric-ca-client register \
                --id.name peer0 --id.secret peer0pw \
                --id.type peer --caname ford-ca 2>&1 || true

              echo "=== Re-enroll peer0 into fresh MSP ==="
              rm -rf "${MSP}"
              FABRIC_CA_CLIENT_HOME="${MSP}" \
              fabric-ca-client enroll \
                -u "http://peer0:peer0pw@ford-ca.i3-ford.svc.cluster.local:7054" \
                --caname ford-ca -M "${MSP}"

              CACERT=$(ls ${MSP}/cacerts/*.pem | head -1 | xargs basename)

              echo "=== Write config.yaml — NodeOUs DISABLED (admincerts mode) ==="
              cat > "${MSP}/config.yaml" << EOF
              NodeOUs:
                Enable: false
              EOF

              echo "=== Populate admincerts with peer cert ==="
              mkdir -p "${MSP}/admincerts"
              cp "${MSP}/signcerts/cert.pem" "${MSP}/admincerts/cert.pem"

              echo "=== Final MSP structure ==="
              find "${MSP}" -type f | sort
              echo "=== DONE ==="
          volumeMounts:
            - mountPath: /var/hyperledger/production
              name: peer-data
      volumes:
        - name: peer-data
          persistentVolumeClaim:
            claimName: peer0-i3tech-pvc
