---
# Role + RoleBinding: ford-sa needs secrets RBAC to write orderer-msp Secret.
# Without this the write-secret container hangs/fails silently causing the job
# to stay in Running state indefinitely.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ford-sa-secrets-rw
  namespace: i3-ford
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ford-sa-secrets-rw
  namespace: i3-ford
subjects:
  - kind: ServiceAccount
    name: ford-sa
    namespace: i3-ford
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: ford-sa-secrets-rw
---
# Job: enroll orderer identity against ford-ca and populate orderer-msp Secret.
# Run once: kubectl apply -f orderer-msp-init-job.yaml
# The orderer StatefulSet must be patched (orderer-statefulset-patch.yaml)
# to mount the resulting Secret before the orderer pod will start.
apiVersion: batch/v1
kind: Job
metadata:
  name: orderer-msp-enroll
  namespace: i3-ford
  labels:
    app.kubernetes.io/part-of: i3-platform
    app.kubernetes.io/component: fabric-msp-init
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: orderer-msp-enroll
    spec:
      serviceAccountName: ford-sa
      restartPolicy: OnFailure
      initContainers:
        # Step 1: enroll the orderer admin identity
        - name: enroll
          image: hyperledger/fabric-ca:1.5.12
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          command:
            - sh
            - -c
            - |
              set -e
              export FABRIC_CA_CLIENT_HOME=/tmp/orderer-msp
              mkdir -p ${FABRIC_CA_CLIENT_HOME}
              # Try ford-ca (canonical name used by all other jobs in this repo);
              # fall back to ca-ford for backwards-compatibility with older CA configs.
              fabric-ca-client enroll \
                -u http://admin:adminpw@ford-ca.i3-ford.svc:7054 \
                --mspdir ${FABRIC_CA_CLIENT_HOME}/msp \
                --caname ford-ca || \
              fabric-ca-client enroll \
                -u http://admin:adminpw@ford-ca.i3-ford.svc:7054 \
                --mspdir ${FABRIC_CA_CLIENT_HOME}/msp \
                --caname ca-ford
              echo "Enroll complete"
              ls ${FABRIC_CA_CLIENT_HOME}/msp
          volumeMounts:
            - name: msp-work
              mountPath: /tmp/orderer-msp
      containers:
        # Step 2: write MSP dirs as a Kubernetes Secret
        - name: write-secret
          image: bitnami/kubectl:latest
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          command:
            - sh
            - -c
            - |
              set -e
              MSP=/tmp/orderer-msp/msp

              # Verify the SA has the secrets RBAC before proceeding
              kubectl auth can-i create secrets -n i3-ford 2>&1 | grep -q yes \
                || { echo "ERROR: ford-sa cannot create secrets in i3-ford — apply RBAC first"; exit 1; }

              # Build kubectl create secret args from directory structure
              ARGS=""
              for dir in cacerts signcerts keystore tlscacerts; do
                if [ -d "${MSP}/${dir}" ]; then
                  for f in ${MSP}/${dir}/*; do
                    [ -f "$f" ] || continue
                    key="${dir}-$(basename $f | tr '.' '-')"
                    ARGS="$ARGS --from-file=${key}=${f}"
                  done
                fi
              done
              if [ -z "$ARGS" ]; then
                echo "ERROR: No MSP files found in ${MSP} — enroll step may have failed"
                exit 1
              fi
              # Delete old secret if present, then recreate
              kubectl delete secret orderer-msp -n i3-ford --ignore-not-found
              eval kubectl create secret generic orderer-msp -n i3-ford $ARGS \
                --type=Opaque
              echo "Secret orderer-msp created"
              kubectl get secret orderer-msp -n i3-ford
          volumeMounts:
            - name: msp-work
              mountPath: /tmp/orderer-msp
      volumes:
        - name: msp-work
          emptyDir: {}
