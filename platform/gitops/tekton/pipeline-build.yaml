---
# Tekton Pipeline — i3 AI Platform Build, Gate & Promote
# Namespace: i3-gitops
#
# 5-gate sequence (STEP-P3-04 + STEP-P3-05):
#   secret-scan → lint-typecheck → run-tests → build-push
#     → trivy-scan (CRITICAL + HIGH) → deploy-staging
#       → ragas-eval ──────────────────┐
#       → promptfoo-redteam ───────────┼→ promote-production
#       → lighthouse-ci (PWA≥80, 3G<2s)┘
#
# All Tasks in this file must exist in namespace i3-gitops.
# SC-P3-04-a verifies: secret-scan, run-tests, ragas-eval, promptfoo-redteam
# SC-P3-04-b verifies: pipeline task sequence correct
# SC-P3-05-c verifies: lighthouse-ci gate present and Succeeded

# ── Task: secret-scan (TruffleHog) ───────────────────────────────────────────
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: secret-scan
  namespace: i3-gitops
spec:
  params:
    - name: GIT_URL
      description: "Repository URL to scan"
    - name: GIT_REVISION
      description: "Git ref to scan"
      default: main
  workspaces:
    - name: source
  steps:
    - name: trufflehog
      image: trufflesecurity/trufflehog:latest
      script: |
        #!/usr/bin/env sh
        set -e
        echo "Running TruffleHog secret scan on $(params.GIT_URL)@$(params.GIT_REVISION)"
        # --since-commit: only scan commits after the remediation baseline (STEP-P1-01).
        # Commits prior to ba28dac contained credentials that have since been rotated
        # and scrubbed from the working tree. Scanning history before that commit
        # would only surface already-rotated and now-invalid credentials.
        trufflehog git \
          --branch "$(params.GIT_REVISION)" \
          --since-commit ba28dac9e55b2ae2436f5c5190198fb1f6455c33 \
          --fail \
          --only-verified \
          --no-update \
          "$(params.GIT_URL)"
        echo "TruffleHog scan: PASS"
    - name: gitleaks
      image: zricethezav/gitleaks:latest
      workingDir: /workspace/source
      script: |
        #!/usr/bin/env sh
        set -e
        echo "Running Gitleaks scan (P2-GATE-10 / HC-7)"
        gitleaks detect \
          --source /workspace/source \
          --config /workspace/source/.gitleaks.toml \
          --redact \
          --exit-code 1
        echo "Gitleaks scan: PASS"
---
# ── Task: lint-typecheck ──────────────────────────────────────────────────────
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: lint-typecheck
  namespace: i3-gitops
spec:
  workspaces:
    - name: source
  steps:
    - name: python-lint
      image: python:3.11-slim
      workingDir: /workspace/source
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        pip install --quiet ruff mypy 2>/dev/null
        echo "=== Ruff lint ==="
        ruff check platform/ --select E,W,F --ignore E501
        echo "=== Mypy typecheck ==="
        mypy platform/admissions/admissions_agent.py \
              platform/testing/testing.py \
              --ignore-missing-imports --no-error-summary
        echo "Python lint+typecheck: PASS"
    - name: ts-typecheck
      image: node:20-alpine
      workingDir: /workspace/source
      script: |
        #!/usr/bin/env sh
        set -e
        echo "=== TypeScript typecheck ==="
        for dir in onboarding-agent platform/engage/web platform/evalos/web platform/pmaas/web; do
          if [ -f "$dir/package.json" ]; then
            echo "Checking $dir..."
            cd /workspace/source/$dir
            npm ci --prefer-offline --silent 2>/dev/null || npm install --silent 2>/dev/null
            npx tsc --noEmit 2>&1 | head -50
            cd /workspace/source
          fi
        done
        echo "TypeScript typecheck: PASS"
---
# ── Task: run-tests ───────────────────────────────────────────────────────────
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-tests
  namespace: i3-gitops
spec:
  workspaces:
    - name: source
  steps:
    - name: python-tests
      image: python:3.11-slim
      workingDir: /workspace/source
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        pip install --quiet pytest pytest-asyncio ragas langchain-openai datasets httpx 2>/dev/null
        echo "=== RAGAS threshold unit tests ==="
        pytest platform/testing/ragas/test_ragas_thresholds.py -v --tb=short
        echo "Python tests: PASS"
    - name: node-tests
      image: node:20-alpine
      workingDir: /workspace/source/onboarding-agent
      script: |
        #!/usr/bin/env sh
        set -e
        npm ci --prefer-offline --silent 2>/dev/null || npm install --silent 2>/dev/null
        npm test -- --passWithNoTests
        echo "Node tests: PASS"
---
# ── Task: buildah-build-push ──────────────────────────────────────────────────
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: buildah-build-push
  namespace: i3-gitops
spec:
  params:
    - name: IMAGE
      description: "Fully qualified image name (registry/org/name:tag)"
    - name: CONTEXT
      description: "Path to build context within workspace"
      default: "."
    - name: DOCKERFILE
      description: "Path to Dockerfile"
      default: "./Dockerfile"
    - name: STORAGE_DRIVER
      default: "vfs"
  workspaces:
    - name: source
    - name: dockerconfig
      description: "OCI registry credentials (Secret)"
  steps:
    - name: build
      image: quay.io/buildah/stable:v1.35
      securityContext:
        privileged: false
        capabilities:
          add: ["SETUID", "SETGID"]
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        buildah --storage-driver=$(params.STORAGE_DRIVER) bud \
          --format=oci \
          --tls-verify=true \
          --no-cache \
          -f $(params.DOCKERFILE) \
          -t $(params.IMAGE) \
          $(params.CONTEXT)
    - name: push
      image: quay.io/buildah/stable:v1.35
      securityContext:
        privileged: false
        capabilities:
          add: ["SETUID", "SETGID"]
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        buildah --storage-driver=$(params.STORAGE_DRIVER) push \
          --tls-verify=true \
          --digestfile /workspace/source/image-digest \
          $(params.IMAGE) \
          docker://$(params.IMAGE)
---
# ── Task: trivy-scan (CRITICAL + HIGH — gate; MEDIUM — warn only) ─────────────
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-scan
  namespace: i3-gitops
spec:
  params:
    - name: IMAGE
      description: "Image reference to scan"
  steps:
    - name: scan-critical-high
      image: aquasec/trivy:0.51.1
      script: |
        #!/usr/bin/env sh
        set -e
        echo "=== Trivy scan: CRITICAL + HIGH (gate) ==="
        trivy image \
          --exit-code 1 \
          --severity CRITICAL,HIGH \
          --ignore-unfixed \
          --no-progress \
          $(params.IMAGE)
        echo "Trivy CRITICAL/HIGH gate: PASS"
    - name: scan-medium-warn
      image: aquasec/trivy:0.51.1
      script: |
        #!/usr/bin/env sh
        echo "=== Trivy scan: MEDIUM (warn only — exit-code 0) ==="
        trivy image \
          --exit-code 0 \
          --severity MEDIUM \
          --ignore-unfixed \
          --no-progress \
          $(params.IMAGE) || true
        echo "Trivy MEDIUM advisory logged."
---
# ── Task: deploy-staging ──────────────────────────────────────────────────────
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-staging
  namespace: i3-gitops
spec:
  params:
    - name: IMAGE
      description: "New image reference"
    - name: STAGING_NAMESPACE
      description: "Staging namespace"
      default: "i3-staging"
    - name: TIMEOUT
      description: "Rollout timeout"
      default: "5m"
  results:
    - name: staging-url
      description: "Base URL of the deployed staging environment"
  steps:
    - name: deploy-and-verify
      image: quay.io/openshift/origin-cli:4.15
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "Deploying $(params.IMAGE) to staging namespace $(params.STAGING_NAMESPACE)"

        # Patch all Deployments in the staging namespace with the new image
        for deploy in admissions-agent onboarding-agent pmaas-agent; do
          if oc get deployment/$deploy -n $(params.STAGING_NAMESPACE) &>/dev/null; then
            oc set image deployment/$deploy app=$(params.IMAGE) -n $(params.STAGING_NAMESPACE)
            oc rollout status deployment/$deploy -n $(params.STAGING_NAMESPACE) --timeout=$(params.TIMEOUT)
            echo "$deploy rollout complete."
          fi
        done

        # Emit staging base URL for downstream tasks
        STAGING_HOST=$(oc get route i3-staging-gateway -n $(params.STAGING_NAMESPACE) \
          -o jsonpath='{.spec.host}' 2>/dev/null || echo "staging.i3technologies.co.ke")
        printf "https://%s" "$STAGING_HOST" | tee $(results.staging-url.path)
        echo " "
        echo "Staging deploy: PASS"
---
# ── Task: ragas-eval ──────────────────────────────────────────────────────────
# Exit code 0: all agents faithfulness >= 0.80 AND relevancy >= 0.75
# Exit code 1: any agent below threshold → pipeline fails
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ragas-eval
  namespace: i3-gitops
spec:
  params:
    - name: STAGING_URL
      description: "Base URL of the staging environment"
    - name: FAITHFULNESS_THRESHOLD
      description: "Minimum RAGAS faithfulness score"
      default: "0.80"
    - name: RELEVANCY_THRESHOLD
      description: "Minimum RAGAS answer relevancy score"
      default: "0.75"
  workspaces:
    - name: source
  steps:
    - name: ragas-gate
      image: python:3.11-slim
      workingDir: /workspace/source
      env:
        - name: LITELLM_BASE_URL
          valueFrom:
            secretKeyRef:
              name: litellm-api-secret
              key: base-url
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-api-secret
              key: api-key
        - name: ADMISSIONS_AGENT_URL
          value: "$(params.STAGING_URL)/admissions"
        - name: ONBOARDING_AGENT_URL
          value: "$(params.STAGING_URL)/onboarding"
        - name: RAGAS_FAITHFULNESS_THRESHOLD
          value: "$(params.FAITHFULNESS_THRESHOLD)"
        - name: RAGAS_RELEVANCY_THRESHOLD
          value: "$(params.RELEVANCY_THRESHOLD)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        pip install --quiet ragas langchain-openai datasets httpx 2>/dev/null
        echo "=== RAGAS gate: all agents ==="
        # Runs platform/testing/testing.py --ragas --all-agents --staging
        # Exit code 0: all agents faithfulness >= 0.80 AND relevancy >= 0.75
        # Exit code 1: any agent below threshold
        python platform/testing/testing.py --ragas --all-agents --staging
        echo "RAGAS gate: PASS"
---
# ── Task: promptfoo-redteam ───────────────────────────────────────────────────
# Exit code 0: all 20 vectors per agent blocked (100% pass rate)
# Exit code 1: any vector passes → pipeline fails
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: promptfoo-redteam
  namespace: i3-gitops
spec:
  params:
    - name: STAGING_URL
      description: "Base URL of the staging environment"
  workspaces:
    - name: source
  steps:
    - name: redteam-gate
      image: node:20-alpine
      workingDir: /workspace/source
      env:
        - name: ADMISSIONS_AGENT_URL
          value: "$(params.STAGING_URL)/admissions"
        - name: ONBOARDING_AGENT_URL
          value: "$(params.STAGING_URL)/onboarding"
        - name: PMAAS_AGENT_URL
          value: "$(params.STAGING_URL)/pmaas"
        - name: LITELLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: litellm-api-secret
              key: api-key
      script: |
        #!/usr/bin/env sh
        set -e
        npm install -g promptfoo@latest --silent 2>/dev/null
        echo "=== promptfoo red-team: OWASP LLM Top 10 — 20 vectors/agent ==="
        # config generated by platform/testing/testing.py --promptfoo-config
        python platform/testing/testing.py --promptfoo-config \
          > /tmp/promptfoo-config.yaml
        # Exit code 0 only if ALL vectors blocked (100% pass rate)
        npx promptfoo eval \
          --config /tmp/promptfoo-config.yaml \
          --no-cache \
          --output /tmp/redteam-results.json
        echo "promptfoo red-team: PASS"
---
# ── Task: promote-production ──────────────────────────────────────────────────
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: promote-production
  namespace: i3-gitops
spec:
  params:
    - name: IMAGE
      description: "Image reference that passed all gates"
    - name: PROD_NAMESPACE
      description: "Production namespace"
      default: "i3-platform"
    - name: TIMEOUT
      description: "Rollout timeout"
      default: "10m"
  steps:
    - name: rolling-update
      image: quay.io/openshift/origin-cli:4.15
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "All 4 gates PASSED. Promoting $(params.IMAGE) to production."
        for deploy in admissions-agent onboarding-agent pmaas-agent; do
          if oc get deployment/$deploy -n $(params.PROD_NAMESPACE) &>/dev/null; then
            oc set image deployment/$deploy app=$(params.IMAGE) \
              -n $(params.PROD_NAMESPACE)
            oc rollout status deployment/$deploy \
              -n $(params.PROD_NAMESPACE) \
              --timeout=$(params.TIMEOUT)
            echo "$deploy promoted to production."
          fi
        done
        echo "Production promotion: COMPLETE"
---
# ── Task: p3-sla-locust (P3-GATE-13: NBA consent p95 ≤ 200ms; batch plan p95 ≤ 3s) ──
# Exit code 0: both SLA limits satisfied
# Exit code 1: any p95 violation → pipeline fails
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: p3-sla-locust
  namespace: i3-gitops
spec:
  params:
    - name: STAGING_URL
      description: "Base URL of the staging environment"
    - name: NBA_CONSENT_USERS
      description: "Concurrent users for NBAConsentUser"
      default: "50"
    - name: BATCH_PLAN_USERS
      description: "Concurrent users for BatchPlanUser"
      default: "20"
    - name: RUN_TIME
      description: "Locust run duration"
      default: "180s"
  workspaces:
    - name: source
  steps:
    - name: p3-sla-gate
      image: python:3.11-slim
      workingDir: /workspace/source
      env:
        - name: LOCUST_BEARER_TOKEN
          valueFrom:
            secretKeyRef:
              name: platform-test-token
              key: bearer-token
        - name: LOCUST_TENANT_ID
          valueFrom:
            secretKeyRef:
              name: platform-test-token
              key: tenant-id
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        pip install --quiet locust 2>/dev/null

        STAGING_HOST="$(params.STAGING_URL)"

        echo "=== P3-GATE-13: NBA Consent SLA (p95 ≤ 200ms, $(params.NBA_CONSENT_USERS) users) ==="
        locust \
          -f platform/testing/locust/locustfile.py \
          NBAConsentUser \
          --headless \
          --users "$(params.NBA_CONSENT_USERS)" \
          --spawn-rate 5 \
          --run-time "$(params.RUN_TIME)" \
          --host "${STAGING_HOST}" \
          --html /tmp/p3-nba-report.html \
          --csv /tmp/p3-nba

        echo "=== P3-GATE-13: Batch Planning SLA (p95 ≤ 3000ms, $(params.BATCH_PLAN_USERS) users) ==="
        locust \
          -f platform/testing/locust/locustfile.py \
          BatchPlanUser \
          --headless \
          --users "$(params.BATCH_PLAN_USERS)" \
          --spawn-rate 2 \
          --run-time "$(params.RUN_TIME)" \
          --host "${STAGING_HOST}" \
          --html /tmp/p3-batch-report.html \
          --csv /tmp/p3-batch

        echo "P3-GATE-13: PASS"
  results:
    - name: nba-p95-ms
      description: "Measured NBA consent p95 latency in milliseconds"
    - name: batch-p95-ms
      description: "Measured batch planning p95 latency in milliseconds"
---
# ── Task: lighthouse-ci (PWA score >= 80; interactive < 2 s on 3G) ───────────
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: lighthouse-ci
  namespace: i3-gitops
spec:
  params:
    - name: ENGAGE_URL
      description: "Engage staging base URL"
      default: "https://engage.i3technologies.co.ke"
    - name: PMAAS_URL
      description: "PMaaS staging base URL"
      default: "https://pmaas.i3technologies.co.ke"
  workspaces:
    - name: source
  steps:
    - name: run-lhci
      image: cypress/browsers:node-20.18.0-chrome-130.0.6723.69-1-ff-131.0.2-edge-130.0.2849.52-1
      workingDir: /workspace/source
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        npm install --global @lhci/cli@0.13 2>/dev/null

        echo "=== Lighthouse CI — Engage ==="
        lhci autorun \
          --config=platform/engage/web/lighthouserc.json \
          --collect.url="$(params.ENGAGE_URL)/dashboard" \
          --assert.assertions.'categories:pwa'='["error",{"minScore":0.80}]' \
          --assert.assertions.'interactive'='["error",{"maxNumericValue":2000}]'

        echo "=== Lighthouse CI — PMaaS ==="
        lhci autorun \
          --config=platform/pmaas/web/lighthouserc.json \
          --collect.url="$(params.PMAAS_URL)/dashboard" \
          --assert.assertions.'categories:pwa'='["error",{"minScore":0.80}]' \
          --assert.assertions.'interactive'='["error",{"maxNumericValue":2000}]'

        echo "Lighthouse CI: PASS"
---
# ── Pipeline: i3-build-pipeline ───────────────────────────────────────────────
# Full gate sequence enforced via runAfter chain.
# IMP-11 adds: eval-harness-gate (Gate 4e) + model-card-gen (post-gate).
#
# Gate order after deploy-staging:
#   4a ragas-eval          faithfulness ≥ 0.80, relevancy ≥ 0.75
#   4b promptfoo-redteam   100 % vectors blocked
#   4c lighthouse-ci       PWA ≥ 80; interactive < 2 s
#   4d p3-sla-locust       NBA consent p95 ≤ 200 ms; batch plan p95 ≤ 3 s
#   4e eval-harness-gate   Swahili/Sheng ≥ 0.65; English baseline ≥ 0.75
#   model-card-gen         Renders model card (non-blocking; always exits 0)
#   promote-production     runAfter: all gate-4 tasks
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: i3-build-pipeline
  namespace: i3-gitops
spec:
  params:
    - name: GIT_URL
      type: string
    - name: GIT_REVISION
      type: string
      default: main
    - name: IMAGE
      type: string
    - name: STAGING_NAMESPACE
      type: string
      default: i3-staging
    - name: PROD_NAMESPACE
      type: string
      default: i3-platform
    - name: FAITHFULNESS_THRESHOLD
      type: string
      default: "0.80"
    - name: RELEVANCY_THRESHOLD
      type: string
      default: "0.75"
    - name: EVAL_SUITE
      type: string
      default: "all"
    - name: SWAHILI_THRESHOLD
      type: string
      default: "0.65"
    - name: ENGLISH_THRESHOLD
      type: string
      default: "0.75"
    - name: EVAL_MODEL
      type: string
      default: "qwen-fast"
  workspaces:
    - name: shared-workspace
    - name: dockerconfig
  tasks:
    # ── Gate 0: Secret scan ──────────────────────────────────────────────────
    - name: secret-scan
      taskRef:
        kind: Task
        name: secret-scan
      params:
        - name: GIT_URL
          value: $(params.GIT_URL)
        - name: GIT_REVISION
          value: $(params.GIT_REVISION)
      workspaces:
        - name: source
          workspace: shared-workspace

    # ── Gate 0: Source checkout (runs after secret-scan to avoid cloning untrusted code first) ──
    - name: git-clone
      runAfter: [secret-scan]
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: Task
          - name: name
            value: git-clone
          - name: namespace
            value: tekton-catalog
      params:
        - name: url
          value: $(params.GIT_URL)
        - name: revision
          value: $(params.GIT_REVISION)
      workspaces:
        - name: output
          workspace: shared-workspace

    # ── Gate 1a: Lint + typecheck ─────────────────────────────────────────────
    - name: lint-typecheck
      runAfter: [git-clone]
      taskRef:
        kind: Task
        name: lint-typecheck
      workspaces:
        - name: source
          workspace: shared-workspace

    # ── Gate 1b: Unit tests ───────────────────────────────────────────────────
    - name: run-tests
      runAfter: [lint-typecheck]
      taskRef:
        kind: Task
        name: run-tests
      workspaces:
        - name: source
          workspace: shared-workspace

    # ── Gate 2: Build & push image ────────────────────────────────────────────
    - name: build-push
      runAfter: [run-tests]
      taskRef:
        kind: Task
        name: buildah-build-push
      params:
        - name: IMAGE
          value: $(params.IMAGE)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig

    # ── Gate 3: Trivy CVE scan (CRITICAL + HIGH block; MEDIUM warn) ───────────
    - name: trivy-scan
      runAfter: [build-push]
      taskRef:
        kind: Task
        name: trivy-scan
      params:
        - name: IMAGE
          value: $(params.IMAGE)

    # ── Staging deploy (gates 3 → 4 bridge) ──────────────────────────────────
    - name: deploy-staging
      runAfter: [trivy-scan]
      taskRef:
        kind: Task
        name: deploy-staging
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: STAGING_NAMESPACE
          value: $(params.STAGING_NAMESPACE)

    # ── Gate 4a: RAGAS quality gate (faithfulness >= 0.80, relevancy >= 0.75) ─
    - name: ragas-eval
      runAfter: [deploy-staging]
      taskRef:
        kind: Task
        name: ragas-eval
      params:
        - name: STAGING_URL
          value: $(tasks.deploy-staging.results.staging-url)
        - name: FAITHFULNESS_THRESHOLD
          value: $(params.FAITHFULNESS_THRESHOLD)
        - name: RELEVANCY_THRESHOLD
          value: $(params.RELEVANCY_THRESHOLD)
      workspaces:
        - name: source
          workspace: shared-workspace

    # ── Gate 4b: promptfoo red-team (20 vectors/agent, 100% block rate) ───────
    - name: promptfoo-redteam
      runAfter: [deploy-staging]
      taskRef:
        kind: Task
        name: promptfoo-redteam
      params:
        - name: STAGING_URL
          value: $(tasks.deploy-staging.results.staging-url)
      workspaces:
        - name: source
          workspace: shared-workspace

    # ── Gate 4c: Lighthouse CI (PWA >= 80; interactive < 2 s on 3G) ──────────
    - name: lighthouse-ci
      runAfter: [deploy-staging]
      taskRef:
        kind: Task
        name: lighthouse-ci
      params:
        - name: ENGAGE_URL
          value: $(tasks.deploy-staging.results.staging-url)
        - name: PMAAS_URL
          value: $(tasks.deploy-staging.results.staging-url)
      workspaces:
        - name: source
          workspace: shared-workspace

    # ── Gate 4d: P3-GATE-13 Locust SLA (NBA consent ≤ 200ms; batch plan ≤ 3s) ─
    - name: p3-sla-locust
      runAfter: [deploy-staging]
      taskRef:
        kind: Task
        name: p3-sla-locust
      params:
        - name: STAGING_URL
          value: $(tasks.deploy-staging.results.staging-url)
      workspaces:
        - name: source
          workspace: shared-workspace

    # ── Gate 4e: IMP-11 eval-harness (Swahili/Sheng + English baseline) ───────
    - name: eval-harness-gate
      runAfter: [deploy-staging]
      taskRef:
        kind: Task
        name: eval-harness-gate
      params:
        - name: SUITE
          value: $(params.EVAL_SUITE)
        - name: SWAHILI_THRESHOLD
          value: $(params.SWAHILI_THRESHOLD)
        - name: ENGLISH_THRESHOLD
          value: $(params.ENGLISH_THRESHOLD)
        - name: MODEL
          value: $(params.EVAL_MODEL)
        - name: PIPELINE_RUN_ID
          value: $(context.pipelineRun.name)
      workspaces:
        - name: source
          workspace: shared-workspace

    # ── Post-gate: Model card generation (non-blocking) ───────────────────────
    - name: model-card-gen
      runAfter: [eval-harness-gate, ragas-eval]
      taskRef:
        kind: Task
        name: model-card-gen
      params:
        - name: MODEL
          value: $(params.EVAL_MODEL)
        - name: PIPELINE_RUN_ID
          value: $(context.pipelineRun.name)
        - name: HARNESS_RESULT_PATH
          value: $(tasks.eval-harness-gate.results.harness-result-path)
      workspaces:
        - name: source
          workspace: shared-workspace

    # ── Promote to production (only after ALL gate-4 tasks pass) ──────────────
    - name: promote-production
      runAfter: [ragas-eval, promptfoo-redteam, lighthouse-ci, p3-sla-locust, eval-harness-gate, model-card-gen]
      taskRef:
        kind: Task
        name: promote-production
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: PROD_NAMESPACE
          value: $(params.PROD_NAMESPACE)
---
# ── EventListener for GitHub webhook triggers ─────────────────────────────────
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: i3-github-listener
  namespace: i3-gitops
spec:
  serviceAccountName: tekton-triggers-sa
  triggers:
    - name: push-to-main
      interceptors:
        - ref:
            name: github
          params:
            - name: secretRef
              value:
                secretName: github-webhook-secret
                secretKey: secret
            - name: eventTypes
              value: ["push"]
        - ref:
            name: cel
          params:
            - name: filter
              value: "body.ref == 'refs/heads/main'"
      bindings:
        - ref: i3-push-binding
      template:
        ref: i3-pipeline-template
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: i3-push-binding
  namespace: i3-gitops
spec:
  params:
    - name: git-url
      value: $(body.repository.clone_url)
    - name: git-revision
      value: $(body.after)
---
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: i3-pipeline-template
  namespace: i3-gitops
spec:
  params:
    - name: git-url
    - name: git-revision
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: i3-build-pipeline-
        namespace: i3-gitops
      spec:
        pipelineRef:
          name: i3-build-pipeline
        params:
          - name: GIT_URL
            value: $(tt.params.git-url)
          - name: GIT_REVISION
            value: $(tt.params.git-revision)
          - name: IMAGE
            value: "de.icr.io/i3-platform/app:$(tt.params.git-revision)"
        workspaces:
          - name: shared-workspace
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 2Gi
          - name: dockerconfig
            secret:
              secretName: icr-dockerconfig
