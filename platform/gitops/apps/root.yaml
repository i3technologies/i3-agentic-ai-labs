# Root app-of-apps — syncs the apps/ directory and creates all child applications
# Apply once: oc apply -f apps/root.yaml -n openshift-gitops
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: i3-platform-root
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: default
  source:
    repoURL: https://github.com/i3technologies/platform-gitops.git
    targetRevision: HEAD
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers:
        - /spec/source/targetRevision
