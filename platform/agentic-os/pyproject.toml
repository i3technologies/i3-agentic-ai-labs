[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ── Project metadata ───────────────────────────────────────────────────────────
[project]
name = "i3-agentic-os"
version = "1.0.0"
description = "i3 Enterprise Agentic AI Operating System — local CLI & REPL"
readme = "README.md"
license = { text = "Proprietary — i3 Technologies" }
requires-python = ">=3.11"

# Core runtime — trimmed to what works without GPU on a dev workstation.
# vLLM is GPU-only; on local machines the runtime uses LiteLLM to proxy
# to any OpenAI-compatible endpoint (local Ollama, cloud API, etc.)
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "dnspython>=2.6.0",
    "typing_extensions>=4.11.0",
    "click>=8.1.0",          # CLI framework
    "rich>=13.0.0",          # pretty terminal output (tables, panels, spinners)
    "python-dotenv>=1.0.0",  # loads .env file so users can store their secrets locally
]

# Optional extras — install with:  pip install "i3-agentic-os[agent]"
[project.optional-dependencies]
agent = [
    "langgraph>=0.2.0,<0.3",
    "langgraph-checkpoint-redis>=0.1.0",
    "litellm>=1.44.0",
    "redis[asyncio]>=5.0.0",
    "langfuse>=2.20.0",
]
eval = [
    "ragas>=0.1.14",
    "datasets>=2.20.0",
]
cos = [
    "ibm-cos-sdk>=2.13.0",
]
all = [
    "i3-agentic-os[agent,eval,cos]",
]

# ── CLI entry points — creates executables on all platforms ───────────────────
# After `pip install`, these commands become available system-wide:
#   Windows:   i3-agent.exe   (in Scripts\)
#   Linux/Mac: i3-agent       (in bin/)
[project.scripts]
i3-agent = "agentic_os.cli:main"

# ── Package discovery ─────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["agentic_os*"]

# ── Linting / formatting (optional, for developers) ──────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
