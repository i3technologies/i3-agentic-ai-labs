# =============================================================
# vLLM Inference Deployment — i3 Agentic AI OS
# Namespace:   i3-agentic-os
# Phase:       Implement (App 3)
# GPU:         2× NVIDIA L40S 48 GB (gx3.8x40x1l40s × 2 worker nodes)
# Models:      Llama-3.3-70B-Instruct-AWQ + IBM Granite-3.0-3B-Instruct
#              (speculative decoding: Granite drafts for Llama)
# HC-3:  autonomy_tier logged per invocation; no agent exceeds L1
# HC-4:  tenant_id passed in LiteLLM metadata header on every call
# HC-5:  vLLM is an inference backend only — never calls external APIs
# =============================================================

# ── Deployment: Llama-3.3-70B + Granite-3B spec-decode ──────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-inference
  namespace: i3-agentic-os
  labels:
    app: vllm-inference
    component: llm-backend
    model: llama-3.3-70b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-inference
  template:
    metadata:
      labels:
        app: vllm-inference
        component: llm-backend
        model: llama-3.3-70b
    spec:
      # ── GPU node placement ──────────────────────────────────
      nodeSelector:
        workload: gpu-inference
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      # ── Init: wait for model PVC to be populated by downloader Job ─
      initContainers:
        - name: wait-for-models
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Llama-70B model files..."
              until [ -f /models/llama-3.3-70b-awq/config.json ]; do
                echo "  model not ready, sleeping 30s..."; sleep 30
              done
              echo "Waiting for Granite-3B model files..."
              until [ -f /models/ibm-granite-3b/config.json ]; do
                echo "  model not ready, sleeping 30s..."; sleep 30
              done
              echo "Both models ready."
          volumeMounts:
            - name: model-storage
              mountPath: /models

      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.0
          args:
            - --model
            - /models/llama-3.3-70b-awq
            # Tensor parallel across both L40S GPUs
            - --tensor-parallel-size
            - "2"
            # 90% GPU VRAM utilisation — leaves headroom for OS + CUDA
            - --gpu-memory-utilization
            - "0.90"
            # Chunked prefill: prevents single-request KV-cache monopoly
            - --enable-chunked-prefill
            # Speculative decoding: Granite-3B as draft model
            - --speculative-model
            - /models/ibm-granite-3b
            - --num-speculative-tokens
            - "5"
            # Bound per-slot KV-cache footprint (reduces fragmentation)
            - --max-model-len
            - "8192"
            # OpenAI-compatible serving name (matches LiteLLM config)
            - --served-model-name
            - llama-3.3-70b-instruct
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            limits:
              nvidia.com/gpu: "2"
              memory: 32Gi
              cpu: "8"
            requests:
              nvidia.com/gpu: "2"
              memory: 32Gi
              cpu: "4"
          volumeMounts:
            - name: model-storage
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 3

      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: vllm-model-pvc
---
# ── Service: Llama-3.3-70B vLLM backend ─────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: vllm-inference
  namespace: i3-agentic-os
  labels:
    app: vllm-inference
spec:
  selector:
    app: vllm-inference
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
# ── Deployment: Qwen-2.5-72B (financial / high-risk routing) ─────────────────
# NOTE: Never co-loaded with Llama-3.3-70B on the same GPU nodes.
#       LiteLLM router directs high_risk_or_financial requests here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: i3-agentic-os
  labels:
    app: vllm-qwen
    component: llm-backend
    model: qwen-2.5-72b
spec:
  replicas: 0  # Scale to 1 when financial routing is needed; start at 0 to save GPU
  selector:
    matchLabels:
      app: vllm-qwen
  template:
    metadata:
      labels:
        app: vllm-qwen
        component: llm-backend
        model: qwen-2.5-72b
    spec:
      nodeSelector:
        workload: gpu-inference
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: wait-for-qwen-model
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until [ -f /models/qwen-2.5-72b-awq/config.json ]; do
                echo "Qwen-72B model not ready, sleeping 30s..."; sleep 30
              done
          volumeMounts:
            - name: model-storage
              mountPath: /models
      containers:
        - name: vllm-qwen
          image: vllm/vllm-openai:v0.6.0
          args:
            - --model
            - /models/qwen-2.5-72b-awq
            - --tensor-parallel-size
            - "2"
            - --gpu-memory-utilization
            - "0.90"
            - --enable-chunked-prefill
            - --max-model-len
            - "8192"
            - --served-model-name
            - qwen-2.5-72b-instruct
            - --host
            - "0.0.0.0"
            - --port
            - "8001"
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          resources:
            limits:
              nvidia.com/gpu: "2"
              memory: 32Gi
              cpu: "8"
            requests:
              nvidia.com/gpu: "2"
              memory: 32Gi
              cpu: "4"
          volumeMounts:
            - name: model-storage
              mountPath: /models
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: vllm-model-pvc
---
# ── Service: Qwen-2.5-72B vLLM backend ──────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen
  namespace: i3-agentic-os
  labels:
    app: vllm-qwen
spec:
  selector:
    app: vllm-qwen
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
  type: ClusterIP
---
# ── PersistentVolumeClaim: shared model storage ──────────────────────────────
# 200 Gi covers: Qwen-72B AWQ (~36 GB) + Llama-70B AWQ (~36 GB) + Granite-3B (~6 GB)
# + download workspace overhead
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vllm-model-pvc
  namespace: i3-agentic-os
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ibmc-vpc-block-general-purpose
  resources:
    requests:
      storage: 200Gi
