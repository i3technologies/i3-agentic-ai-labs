apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sit-default-deny
  namespace: i3-sit
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sit-allow-ingress
  namespace: i3-sit
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-monitoring
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sit-allow-egress
  namespace: i3-sit
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-model-gateway
      ports: [{port: 4000, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-data
      ports: [{port: 5432, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-messaging
      ports: [{port: 9092, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-ai-lab
      ports: [{port: 8000, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-auth
      ports: [{port: 8443, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-ott
      ports: [{port: 8333, protocol: TCP}, {port: 5678, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-evalos
      ports: [{port: 3000, protocol: TCP}]
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: i3-talent
      ports: [{port: 3000, protocol: TCP}, {port: 8000, protocol: TCP}]
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Africa's Talking and external HTTPS
    - ports:
        - port: 443
          protocol: TCP
