---
# ============================================================
# ExternalSecrets — IBM Cloud Secrets Manager → crm-intelligence
#
# Requires:
#   - External Secrets Operator (ESO) installed on ROKS cluster
#   - IBM Cloud Secrets Manager instance in ibm-secrets-manager-group
#   - A service-to-service IAM API key with SecretsReader role
#     stored in the Kubernetes Secret 'ibm-sm-api-key' below
#
# HC-6: CRM_HMAC_SECRET injected via ESO — never baked into images.
# HC-7: No DEV_BYPASS_AUTH flags permitted in any injected secret.
# ============================================================

# ── 1. SecretStore — IAM-authenticated IBM Cloud Secrets Manager ──────────────
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: ibm-secrets-manager
  namespace: crm-intelligence
spec:
  provider:
    ibm:
      serviceUrl: "https://us-south.secrets-manager.cloud.ibm.com"
      auth:
        secretRef:
          secretApiKeySecretRef:
            name: ibm-sm-api-key          # pre-created k8s Secret with key: apikey
            key: apikey

---
# ── 2. Bootstrap Secret for SecretStore IAM key ───────────────────────────────
# Created once by the platform operator; never rotated via GitOps.
# Managed by rotate-secrets skill (OpenBao i3/crm/iam-api-key).
apiVersion: v1
kind: Secret
metadata:
  name: ibm-sm-api-key
  namespace: crm-intelligence
  annotations:
    # Sentinel: this secret is populated by the rotate-secrets runbook,
    # not by this file.  The value below is a placeholder.
    platform.i3.io/managed-by: "rotate-secrets-runbook"
type: Opaque
stringData:
  apikey: "REPLACE_VIA_ROTATE_SECRETS_RUNBOOK"   # HC-7: NOT a bypass token

---
# ── 3. ExternalSecret — CRM application secrets ──────────────────────────────
#
# Maps IBM Cloud Secrets Manager secret groups to Kubernetes Secret keys.
# Refresh interval: 1h — balances rotation latency vs API call quota.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crm-app-secrets
  namespace: crm-intelligence
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ibm-secrets-manager
    kind: SecretStore
  target:
    name: crm-app-secrets          # resulting k8s Secret name
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: crm-intelligence

  data:
    # HC-6: HMAC secret — keyed HMAC-SHA256 for PII hashing
    - secretKey: CRM_HMAC_SECRET
      remoteRef:
        key: crm/hmac-secret
        property: value

    # PostgreSQL app user credentials (crm_app role)
    - secretKey: DB_PASSWORD
      remoteRef:
        key: crm/db-password
        property: value

    - secretKey: DB_HOST
      remoteRef:
        key: crm/db-host
        property: value

    # Redis password (Celery broker + rate limiter)
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: crm/redis-password
        property: value

    # Outbound CRM integration tokens
    - secretKey: SALESFORCE_CLIENT_SECRET
      remoteRef:
        key: crm/salesforce-client-secret
        property: value

    - secretKey: HUBSPOT_API_KEY
      remoteRef:
        key: crm/hubspot-api-key
        property: value

---
# ── 4. ExternalSecret — PostgreSQL operator credentials ──────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crm-pg-app-secret
  namespace: crm-intelligence
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ibm-secrets-manager
    kind: SecretStore
  target:
    name: crm-pg-app-secret        # consumed by CloudNativePG bootstrap
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: crm/db-username
        property: value
    - secretKey: password
      remoteRef:
        key: crm/db-password
        property: value

---
# ── 5. ExternalSecret — IBM COS backup credentials ────────────────────────────
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: crm-cos-secret
  namespace: crm-intelligence
spec:
  refreshInterval: 6h
  secretStoreRef:
    name: ibm-secrets-manager
    kind: SecretStore
  target:
    name: crm-cos-secret
    creationPolicy: Owner
  data:
    - secretKey: ACCESS_KEY_ID
      remoteRef:
        key: crm/cos-access-key-id
        property: value
    - secretKey: SECRET_ACCESS_KEY
      remoteRef:
        key: crm/cos-secret-access-key
        property: value
