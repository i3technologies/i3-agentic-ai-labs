# .gitleaks.toml — i3 AI Platform Secret Detection Rules
# Used by: platform/gitops/tekton/pipeline-build.yaml (secret-scan task)
# Reference: STEP-P1-02 / SC-P1-02

title = "i3 Platform Gitleaks Config"

[extend]
# Extend the default built-in ruleset
useDefault = true

# ── Custom rules for i3-specific credential patterns ─────────────────────────

[[rules]]
id          = "i3-password-pattern"
description = "i3 platform hardcoded password (e.g. i3-<Service>-<Role>-2026!)"
regex       = '''i3-[A-Za-z]+-[A-Za-z0-9]+-2026!'''
tags        = ["secret", "password", "i3-platform"]

[[rules]]
id          = "litellm-master-key"
description = "LiteLLM master/API key committed in source"
regex       = '''sk-litellm-i3-[a-f0-9]{32}'''
tags        = ["secret", "api-key", "litellm"]

[[rules]]
id          = "litellm-virtual-key"
description = "LiteLLM virtual project key"
regex       = '''sk-[A-Za-z0-9]{20,}'''
tags        = ["secret", "api-key", "litellm"]
[rules.allowlist]
  description = "Allow placeholder/test patterns"
  regexes     = ['''sk-\*{3,}''', '''sk-test''']

[[rules]]
id          = "openbao-token"
description = "OpenBao / Vault token in source"
regex       = '''(VAULT_TOKEN|bao_token)\s*[=:]\s*['"]?[shb]\.[A-Za-z0-9]{24,}'''
tags        = ["secret", "vault", "openbao"]

[[rules]]
id          = "keycloak-admin-password"
description = "Keycloak admin credential committed"
regex       = '''RemE4CE[A-Za-z0-9+/=]{4,}'''
tags        = ["secret", "keycloak"]

[[rules]]
id          = "i3-jwt-secret"
description = "i3 JWT / SECRET_KEY value in source"
regex       = '''i3-[A-Za-z0-9]+-JWT-Secret-[0-9]{4}'''
tags        = ["secret", "jwt"]

[[rules]]
id          = "pgsql-inline-url"
description = "Inline PostgreSQL connection string with password"
regex       = '''postgresql://[^:]+:[^@]{6,}@'''
tags        = ["secret", "database"]
[rules.allowlist]
  description = "Allow env-var-templated URLs"
  regexes     = ['''postgresql://[^:]+:\$\{''', '''postgresql://[^:]+:\$\(''']

[[rules]]
id          = "seaweedfs-secret"
description = "SeaweedFS S3 secret key"
regex       = '''i3-SeaweedFS-[A-Za-z0-9-]+-2026!'''
tags        = ["secret", "s3"]

[[rules]]
id          = "n8n-api-key"
description = "n8n automation API key"
regex       = '''i3-N8N-[A-Za-z0-9-]+-2026!'''
tags        = ["secret", "n8n"]

[[rules]]
id          = "directus-admin-token"
description = "Directus admin token"
regex       = '''i3-Directus-[A-Za-z0-9-]+-2026!'''
tags        = ["secret", "directus"]

# ── Global allowlist ─────────────────────────────────────────────────────────
[allowlist]
description = "Global exceptions — test fixtures, comments, OpenBao retrieve hints"
paths       = [
  # Allow vault kv get retrieve-hint comments in SCRUBBED files
  '''\.gitleaks\.toml''',
  # Ignore binary / compiled outputs
  '''\.pyc$''',
  '''node_modules/''',
  '''dist/''',
]
regexes = [
  # Scrubbed placeholder comments are fine
  '''vault kv get''',
  # Test / CI environment variable placeholders
  '''PLACEHOLDER''',
  '''<REPLACE>''',
  # Redacted marker used in HTML docs
  '''BREVO_API_KEY_REDACTED''',
]

[[rules]]
id          = "brevo-api-key"
description = "Brevo (Sendinblue) API key"
regex       = '''xkeysib-[0-9a-f]{64}-[A-Za-z0-9]{10,}'''
tags        = ["brevo", "sendinblue", "email", "api-key"]
severity    = "critical"
